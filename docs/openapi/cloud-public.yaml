        give manage mode (pms:write) to an agent governed by these policies: it can change the
        policies that decide its own access. Upstream GET /service/{serviceName}/policy. Returns the
        selected service's stored authz policies in upstream PMS shape, including the Cloud policy
        ID used by GET and DELETE."
      security:
        - pmsToken: []
      parameters:
        - $ref: "#/components/parameters/serviceName"
      responses:
        "200":
          description: Success.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control5"
            X-Quota-Daily-Remaining:
