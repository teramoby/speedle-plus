components:
  schemas:
    AdsRequest:
      type: object
      properties:
        subject:
          anyOf:
            - type: object
              properties:
                principals:
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          name:
                            type: string
                          idd:
                            type: string
                        additionalProperties: {}
                    - type: "null"
                tokenType:
                  type: string
                token:
                  type: string
              additionalProperties: {}
            - type: "null"
        serviceName:
          type: string
          description:
            "Send in every request, as with Speedle: the name of the service to evaluate, inside
            the API key's account; never defaulted. A missing, empty or non-string name, or one that
            names no service of the account, returns 404 service_not_found."
        resource:
          type: string
        action:
          type: string
        attributes:
          description:
            Speedle typed attributes. Cloud bounds them to 50 items and 16,384 canonical UTF-8 JSON
            bytes.
          anyOf:
            - maxItems: 50
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    anyOf:
                      - type: string
                        enum:
                          - string
                          - numeric
                          - bool
                          - datetime
                        description:
                          "string: JSON string. numeric: JSON number. bool: true or false. datetime: JSON string
                          in RFC 3339, Ruby date or Unix date layout, converted to Unix seconds. An
                          omitted or empty type passes the JSON value through unconverted."
                      - type: string
                        const: ""
                  value:
                    description:
                      A single value of the type, or an array of such values. null, null items and items of
                      different types return 400.
                    $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
                required:
                  - name
                  - value
                additionalProperties: {}
                description: "One typed attribute: Speedle JsonAttribute."
            - type: "null"
      required:
        - serviceName
      additionalProperties: {}
      description: Speedle REST JsonContext.
      $defs:
        __schema0:
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
      examples:
        - subject:
            principals:
              - type: user
                name: alice
          serviceName: books
          resource: /books/123
          action: get
        - subject:
            principals:
              - type: user
                name: alice
          serviceName: books
          resource: /books/123
          action: get
          attributes:
            - name: team
              type: string
              value: engineering
            - name: level
              type: numeric
              value: 3
            - name: active
              type: bool
              value: true
            - name: when
              type: datetime
              value: 2026-11-05T03:00:00Z
            - name: tags
              type: string
              value:
                - a
                - b
    AdsDecision:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: integer
          minimum: 0
          maximum: 6
        errorMessage:
          type: string
      required:
        - allowed
        - reason
      additionalProperties: false
      examples:
        - allowed: true
          reason: 0
        - allowed: false
          reason: 3
    AdsRoles:
      type: array
      items:
        type: string
      examples:
        - []
        - - reader
    AdsPermissions:
      type: array
      items:
        type: object
        properties:
          resource:
            type: string
          actions:
            anyOf:
              - type: array
                items:
                  type: string
              - type: "null"
        required:
          - resource
          - actions
        additionalProperties: false
      examples:
        - []
        - - resource: /books
            actions:
              - get
    AdsInvalidRequestError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
      examples:
        - error: SPDL-0004 value "2026-11-05" is not a supported date time
        - error:
            "SPDL-0004 unable to decode request: json: cannot unmarshal object into Go struct field
            JsonContext.attributes of type []*adsrest.JsonAttribute"
    AdsUnauthorizedError:
      anyOf:
        - type: object
          properties:
            error:
              type: string
              enum:
                - unauthorized
          required:
            - error
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
              enum:
                - api_key_expired
          required:
            - error
          additionalProperties: false
      examples:
        - error: unauthorized
        - error: api_key_expired
    AdsMethodNotAllowedError:
      type: object
      properties:
        error:
          type: string
          enum:
            - method_not_allowed
      required:
        - error
      additionalProperties: false
      examples:
        - error: method_not_allowed
    AdsForbiddenError:
      anyOf:
        - type: object
          properties:
            error:
              type: string
              enum:
                - insufficient_scope
          required:
            - error
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
      examples:
        - error: insufficient_scope
    AdsRequestTooLargeError:
      type: object
      properties:
        error:
          type: string
          enum:
            - request_too_large
      required:
        - error
      additionalProperties: false
      examples:
        - error: request_too_large
    AdsServiceNotFoundError:
      type: object
      properties:
        error:
          type: string
          enum:
            - service_not_found
      required:
        - error
      additionalProperties: false
      examples:
        - error: service_not_found
    AdsRateLimitError:
      type: object
      properties:
        error:
          type: string
          enum:
            - rate_limited
            - daily_quota_exceeded
      required:
        - error
      additionalProperties: false
      examples:
        - error: rate_limited
        - error: daily_quota_exceeded
    AdsInternalError:
      anyOf:
        - type: object
          properties:
            error:
              type: string
              enum:
                - internal_error
          required:
            - error
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
      examples:
        - error: internal_error
        - error: "SPDL-2001 Application books is not found "
    AdsUnavailableError:
      type: object
      properties:
        error:
          type: string
          enum:
            - quota_unavailable
            - snapshot_unavailable
            - fallback_unavailable
      required:
        - error
      additionalProperties: false
      examples:
        - error: quota_unavailable
        - error: snapshot_unavailable
        - error: fallback_unavailable
    PmsPolicyWrite:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        effect:
          type: string
          enum:
            - grant
            - deny
        permissions:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
                minLength: 1
              resourceExpression:
                type: string
                minLength: 1
              actions:
                minItems: 1
                type: array
                items:
                  type: string
                  minLength: 1
            required:
              - actions
            additionalProperties: false
            description:
              One PMS permission. The Cloud requires exactly one of resource (exact) or
              resourceExpression (regular expression) so the response round-trips through SPDL.
        principals:
          minItems: 1
          type: array
          items:
            minItems: 1
            type: array
            items:
              type: string
              pattern: ^(?:idd=[^\r\n\u2028\u2029]+:(?:user|group|role|entity):[^\r\n\u2028\u2029]+|(?:user|group|role|entity):[^\r\n\u2028\u2029]+)$
              description:
                'An encoded PMS principal: "<type>:<name>" or "idd=<idd>:<type>:<name>", type one of
                user, group, role or entity.'
        condition:
          type: string
      required:
        - name
        - effect
        - permissions
        - principals
      additionalProperties: false
      examples:
        - name: read-books
          effect: grant
          permissions:
            - resource: /books
              actions:
                - get
                - list
          principals:
            - - user:alice
            - - role:librarian
        - name: expired-writes
          effect: deny
          permissions:
            - resourceExpression: /books/.*
              actions:
                - write
                - delete
          principals:
            - - user:bob
          condition: request_time < '2026-01-01 00:00:00'
    PmsPolicy:
      type: object
      properties:
        id:
