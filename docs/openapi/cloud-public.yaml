openapi: 3.1.0
info:
  title: Speedle Cloud API
  version: 0.4.0
  description:
    "API-key contract for cloud.speedle.io: ADS authorization checks and PMS policy
    management. Console session, account, API-key administration and policy-sync routes are not part
    of this document."
servers:
  - url: https://cloud.speedle.io
    description: production
paths:
  /authz-check/v1/is-allowed:
    post:
      operationId: ads-is-allowed
      summary: Check authorization in the service the request names
      description:
        "Authenticated ADS contract B (#100); declaration is not evidence of runtime cutover.
        Accept Authorization: Bearer <AdsBearerToken> or, once the policy-distribution feature is
        on, the account-scoped <AdsInstanceCredential> (scheme is case-insensitive; the credential
        remains case-sensitive). Anonymous requests and cookie-session-only requests return 401; no
        session/CSRF authorization and no CORS. For admissible-size matched POSTs, verify the
        credential before parsing JSON, then apply burst limiting, the instance fallback counter for
        adsi_, account-wide daily quota and business validation in that order. The free account cap
        is 10,000 matched PMS+ADS chargeable handler calls per UTC day, shared across its services,
        API keys and sessions, resetting at 00:00 UTC. The request and response bodies are the
        Speedle REST contract (pkg/svcs/adsrest, #213): the same JsonContext fields, typed
        attributes and bodies, decoded by the same Go decoder, so unknown fields are ignored and
        errors carry the Speedle message. The verified credential supplies the trusted account;
        never take ownership from the request. API keys are account-level (#374): send serviceName
        in every request, as with Speedle; it selects the service inside the key's account and is
        never defaulted. The body serviceName is matched the way Go's decoder maps the ServiceName
        field (case-insensitive key, the last string occurrence wins), exactly as for adsi_
        credentials. A body that names no service, or names a service that does not exist or belongs
        to another account, is the one byte-identical 404 service_not_found, after the account quota
        charge. An adsi_ instance credential selects the service the same way, resolved only inside
        the credential's account and the instance's explicit service set; a service outside the set
        is the same 404. Once resolved, the same snapshot, engine and body bytes produce the same
        decision for both credential types, so decisions are byte-identical; an adsi_ call is
        attributed to the ads_fallback surface and X-Speedle-Decision-Source: cloud-fallback. Each
        adsi_ call is charged to the instance's 2,000 calls/UTC-day fallback budget before the
        account quota; exceeding it returns 503 fallback_unavailable without an account charge. Like
        Speedle without a token asserter, subject.token and tokenType are accepted and ignored:
        Speedle Cloud does not validate subject tokens, and decisions use subject.principals only.
        Consume one daily unit for admitted outcomes, including invalid business inputs, policy
        denials and Speedle-compatible engine errors caused by the request; Cloud-side handler 5xx
        (for example snapshot_unavailable, internal_error or another Cloud error code) is refunded
        only after the independent QuotaRelief ledger approves it within a per-account daily cap,
        and auth/routing/burst/size/quota-reservation rejections are uncharged. While the counter
        cannot confirm a lease, bearer ADS decisions for the account are throttled to two per second
        on that isolate: over-rate requests wait in a FIFO queue for at most ten seconds (at most
        128 waiting callers per isolate across accounts), a longer wait returns quota_unavailable
        with Retry-After: 30 before the handler, and throttling lasts until a lease is confirmed
        again, never crossing UTC midnight. Every throttled admission first consumes one unit of the
        independent QuotaRelief outage allowance (10,000 per account per UTC day by default); outage
        admissions are extra allowance outside the daily quota, are not written to reserved and
        never cause a 429 on recovery. They are separately metered, and fail closed when the ledger
        is unavailable or the allowance is exhausted. Without a confirmed lease from the current UTC
        day, for example on a cold isolate, quota_unavailable fails closed. Use only a valid scoped
        KV snapshot and scoped/revision-aware evaluator; never a bundled demo or D1
        policy-evaluation fallback. Snapshot propagation remains approximately 60 seconds; the
        session-only Playground can read current D1 data separately. lastUsedAt updates
        asynchronously at most once per hour and never changes authorization. Speedle
        RESTService.IsAllowed. Both an allow and a policy denial return 200 IsAllowedResponse;
        evaluator errors are a 200 denial with errorMessage, exactly as Speedle returns them."
      security:
        - apiToken: []
        - adsInstanceCredential: []
      requestBody:
        $ref: "#/components/requestBodies/RequestBody7"
      responses:
        "200":
          description: Upstream ADS result, including successful policy denials.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control4"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining3"
            X-Speedle-Decision-Source:
              $ref: "#/components/headers/X-Speedle-Decision-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDecision"
        "400":
          $ref: "#/components/responses/Response32"
        "401":
          $ref: "#/components/responses/Response33"
        "403":
          $ref: "#/components/responses/Response34"
        "404":
          $ref: "#/components/responses/Response35"
        "405":
          $ref: "#/components/responses/Response36"
        "413":
          $ref: "#/components/responses/Response37"
        "429":
          $ref: "#/components/responses/Response38"
        "500":
          $ref: "#/components/responses/Response39"
        "503":
          $ref: "#/components/responses/Response40"
