        and auth/routing/burst/size/quota-reservation rejections are uncharged. While the counter
        cannot confirm a lease, bearer ADS decisions for the account are throttled to two per second
        on that isolate: over-rate requests wait in a FIFO queue for at most ten seconds (at most
        128 waiting callers per isolate across accounts), a longer wait returns quota_unavailable
        with Retry-After: 30 before the handler, and throttling lasts until a lease is confirmed
        again, never crossing UTC midnight. Every throttled admission first consumes one unit of the
        independent QuotaRelief outage allowance (10,000 per account per UTC day by default); outage
        admissions are extra allowance outside the daily quota, are not written to reserved and
        never cause a 429 on recovery. They are separately metered, and fail closed when the ledger
        is unavailable or the allowance is exhausted. Without a confirmed lease from the current UTC
