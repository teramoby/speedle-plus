  securitySchemes:
    pmsToken:
      type: http
      scheme: bearer
      bearerFormat: spdl_<canonical uppercase ULID>_<43 base62 digits>
      description:
        An account-level policy-management API key created in the console with recent
        authentication; it reaches every service of its account. Fixed scope pms:read (list/get) or
        pms:write (also create/delete policies and services); ads keys are rejected with 403
        insufficient_scope, and management keys are rejected by /authz-check/v1. No scope manages
        the account itself (sessions, API keys, identities). Management scopes cannot be created
        while the stage has sign-in disabled (today prod). HMAC-only storage, one-time disclosure on
        creation, revocable, with a required server-computed expiry. Never give manage mode to an agent governed
        by these policies.
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: spdl_<canonical uppercase ULID>_<43 base62 digits>
      description:
        "Account-level API key with the ads scope: authorizes ADS for every service of its
        account, selected per request by the body serviceName; never authorizes PMS or account
        management. pms:read/pms:write keys return 403 insufficient_scope on this API. Credential
        shape is AdsBearerToken; require a single Bearer scheme plus the exact case-sensitive
        credential. One-time disclosure on creation, HMAC-only persisted verification, and a required server-computed expiry. Positive verification caches have fixed verifiedAt/validUntil authority of at
        most 60000 ms from the START of the authoritative D1 lookup, and never later than expiresAt. Cache hits, KV refills and late
        writes racing revocation never extend that deadline; expired records require fresh D1
        verification and cannot authorize on storage failure. KV failure may fall back to D1 for API
        key verification only, never for policy evaluation. Revocation invalidates existing local/KV
        entries; account deletion and account suspension use the same bounded authority. Deleting a
        service does not revoke API keys. This contract does not ship a verifier or enable runtime
        cutover; #81 requires accepted #98/#99, #79 stage credentials and probe/rollback
        compatibility."
    adsInstanceCredential:
      type: http
      scheme: bearer
      bearerFormat: adsi_<canonical uppercase ULID instanceId>_<43 base62 digits>
      description:
        "Account-scoped, read-only ADS instance credential (75 characters). It authorizes the
        /policy-source/v1/* sync API, the instance channel and /authz-check/v1/* fallback for
        services in the instance's service set, and nothing else: no policy management, no token
        issuance, no service outside the set. Cloud stores only HMAC-SHA256(ADS_PEPPER, secret) and
        discloses the plaintext once. Revocation is per instance; a revoked credential stops within
        the fixed 60-second verification window. The secret never appears in a URL, log, event or
        command."
  headers:
    Cache-Control4:
      schema:
        type: string
        const: no-store
      example: no-store
    X-RateLimit-Limit:
      schema:
        type: string
        const: "600"
      example: "600"
      description:
        Present after bearer verification. Per-API-key 600 requests per 60 seconds, approximate
        per location. The binding exposes no remaining count; X-RateLimit-Remaining is omitted.
        Early size/verification failures may omit this header.
    X-Quota-Daily-Remaining3:
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
      example: "9999"
      description:
        Present after handler admission, including Cloud-side 5xx responses whose refund the
        independent relief ledger approved within the per-account daily cap; omitted on
        authentication, scope, routing, size, burst and quota-reservation rejections. Estimate based
        on the latest lease's unreserved snapshot, local remaining and approved refund credits.
        Outage admissions are extra allowance outside the daily quota and are not deducted. Other
        isolates and abandoned reservations make it approximate; it resets at UTC midnight.
        Informational only.
    X-Speedle-Decision-Source:
      schema:
        type: string
        const: cloud-fallback
      example: cloud-fallback
      description:
        "Present only on a response to a request authenticated with an adsi_ instance
        credential (the Cloud fallback path); never sent to a request authenticated with an spdl_
        API key. Informational: callers may observe it, and it must never drive a security
        decision."
    WWW-Authenticate:
      schema:
        type: string
        const: Bearer
      example: Bearer
    Allow:
      schema:
        type: string
        const: POST
      example: POST
      description: The only method these paths accept.
    Retry-After6:
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: string
        pattern: ^[1-9][0-9]*$
        description:
          "Required on every 429: positive integer delay-seconds. For daily_quota_exceeded,
          ceil((next UTC midnight - now)/1000)."
      description:
        "Required positive integer delay-seconds. rate_limited: 60; daily_quota_exceeded:
        ceil((next 00:00 UTC - now)/1000)."
      example: "60"
    X-Quota-Daily-Remaining4:
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
      example: "9999"
      description:
        Present only for snapshot_unavailable, which is answered after handler admission.
        Omitted for quota_unavailable and fallback_unavailable. Present after handler admission,
        including Cloud-side 5xx responses whose refund the independent relief ledger approved
        within the per-account daily cap; omitted on authentication, scope, routing, size, burst and
        quota-reservation rejections. Estimate based on the latest lease's unreserved snapshot,
        local remaining and approved refund credits. Outage admissions are extra allowance outside
        the daily quota and are not deducted. Other isolates and abandoned reservations make it
        approximate; it resets at UTC midnight. Informational only.
    Retry-After7:
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: string
        pattern: ^[1-9][0-9]*$
        description:
          "Required on every 429: positive integer delay-seconds. For daily_quota_exceeded,
          ceil((next UTC midnight - now)/1000)."
      description:
        "Required for quota_unavailable: 30. Not required for snapshot_unavailable.
        fallback_unavailable: seconds to the next UTC midnight for an exhausted instance budget, 30
        for an unreachable counter."
      example: "30"
    Cache-Control5:
      schema:
        type: string
        const: no-store
      example: no-store
      description: Management responses must not be cached.
    X-Quota-Daily-Remaining5:
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
      example: "9999"
      description:
        Present after handler admission, including Cloud-side 5xx responses whose refund the
        independent relief ledger approved within the per-account daily cap. Account-wide estimate
        under the same lease semantics as the console API; omitted on auth, scope, routing, size,
        burst and reservation rejections.
    X-RateLimit-Limit2:
      schema:
        type: string
        const: "600"
      example: "600"
      description:
        Present after bearer verification. Per-API-key 600 requests per 60 seconds, shared with
        the ADS limiter; the binding exposes no remaining count, so X-RateLimit-Remaining is
        omitted.
    Retry-After8:
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description:
        "Required positive delay-seconds. Burst: 60. daily_quota_exceeded: ceil((next 00:00 UTC
        - now)/1000)."
      example: "60"
    Retry-After9:
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: "Required for quota_unavailable: 30."
      example: "30"
  responses:
    Response32:
      description:
        'Speedle httputils.HandleError body {error: "SPDL-0004 <message>"}, byte for byte as
        Speedle writes it: invalid JSON or a field of the wrong JSON type (Go decoder message),
        attribute type conversion, null values, unsupported datetime layouts. Cloud-only, in the
        same shape: null principal or attribute items (Speedle crashes the connection), more than 50
        attributes or more than 16,384 canonical UTF-8 JSON attribute bytes.'
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining3"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsInvalidRequestError"
    Response33:
      description:
        "api_key_expired: matching API key at or after expiresAt, even on cache hits. No daily
        charge. unauthorized: missing/malformed/unknown bearer credential or wrong secret. A cookie
        session alone never authorizes ADS. Revoked API keys and deleted/inactive owners cease
        authorization within the fixed verification authority window, at most 60 seconds. No daily
        charge."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        WWW-Authenticate:
          $ref: "#/components/headers/WWW-Authenticate"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsUnauthorizedError"
    Response34:
      description:
        "insufficient_scope (Cloud-only): a valid API key whose fixed scope is pms:read or
        pms:write cannot call the ADS API. This check happens after credential verification but
        before the burst limiter, daily quota or request decoding, and is not charged.
        all-granted-roles and all-granted-permissions can also return a Speedle 403 {error: message}
        for an ExceedLimit evaluator error. A request that names no service of the credential's
        account gets 404 service_not_found, never a 403."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining3"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsForbiddenError"
    Response35:
      description:
        "service_not_found: the body does not select a service of the credential's account. The
        serviceName is read the way Go's decoder maps it (case-insensitive key, last string
        occurrence wins); the body is missing it, it is empty or not a string, the body is not one
        JSON object, or it names a service that does not exist or belongs to another account. For an
        adsi_ instance credential, a service outside the instance's set is the same answer. Every
        case returns this byte-identical body. One account daily-quota unit is charged (and, for
        adsi_, the instance fallback counter)."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining3"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsServiceNotFoundError"
    Response36:
      description:
        "method_not_allowed: these paths accept only POST. The Worker answers unsupported
        methods with this JSON envelope and Allow: POST before authentication, quota or body
        decoding. The edge WAF may block a non-POST request earlier with its own response (#82), so
        clients must also accept a non-JSON block response at the edge."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        Allow:
          $ref: "#/components/headers/Allow"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsMethodNotAllowedError"
    Response37:
      description:
        "request_too_large: the global 64 KiB request-body guard can reject before verification
        or JSON parsing; no daily charge."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsRequestTooLargeError"
    Response38:
      description:
        rate_limited for the approximate per-API-key 600/minute/location burst cap, or
        daily_quota_exceeded for the strict account-wide PMS+ADS daily quota. Both require
        Retry-After and do not enter the handler.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        Retry-After:
          $ref: "#/components/headers/Retry-After6"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsRateLimitError"
    Response39:
      description:
        "internal_error: fail closed without credential, parser, engine or storage details. A
        Cloud-side failure after handler entry is refunded only when the independent relief ledger
        approves it within the per-account daily cap; otherwise it stays charged. all-granted-roles
        and all-granted-permissions can also return a Speedle 500 {error: message} for an evaluator
        error the request caused, as Speedle does; that Speedle-compatible engine error is always
        charged like any 4xx or denial."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining3"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsInternalError"
    Response40:
      description:
        "quota_unavailable: no confirmed lease for the current UTC day, the throttled ADS queue
        would wait more than ten seconds, the per-account outage allowance is exhausted, or the
        relief ledger is unavailable; fail closed before handler entry with Retry-After: 30.
        snapshot_unavailable: no usable trusted scoped snapshot (missing, malformed, out of bounds
        or mismatched); fail closed without a daily charge, with no bundled demo or D1
        policy-evaluation fallback. fallback_unavailable: an adsi_ credential exhausted its 2,000
        calls/UTC-day budget (Retry-After: time to the next UTC midnight) or its counter is
        unreachable (Retry-After: 30). quota_unavailable and fallback_unavailable are rejected
        before handler admission and omit X-Quota-Daily-Remaining; only snapshot_unavailable carries
        it."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit"
        X-Speedle-Decision-Source:
          $ref: "#/components/headers/X-Speedle-Decision-Source"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining4"
        Retry-After:
          $ref: "#/components/headers/Retry-After7"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsUnavailableError"
    Response41:
      description:
        "invalid_request, or the engine's parse/custom-function message as {error: string}; no
        source, credentials or internal details are echoed."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsInvalidRequestError"
    Response42:
      description:
        "api_key_expired: matching API key at or after expiresAt, including cached
        verification. unauthorized: missing, malformed, revoked or inactive-account API key. A
        session cookie never authorizes this API."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsUnauthorizedError"
    Response43:
      description:
        "insufficient_scope: the API key is valid but its fixed scope cannot perform this
        operation (ads keys cannot manage; pms:read keys cannot mutate)."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsForbiddenError"
    Response44:
      description:
        "not_found: the service name does not exactly match a service of this API key's
        account, or the policy ID is unknown, malformed, of another kind or another service. Never
        discloses other accounts."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsNotFoundError"
    Response45:
      description:
        "service_exists (duplicate service name in this account), policy_exists, or
        quota_exceeded with limit: 200 for the combined authz + role policy cap across the account
        or limit: 100 for the service cap."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsConflictError"
    Response46:
      description: "request_too_large: the request exceeds 64 KiB before parsing; no daily charge."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsRequestTooLargeError"
    Response47:
      description:
        rate_limited (per-API-key burst, uncharged) or daily_quota_exceeded (no handler entry);
        Retry-After is mandatory.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        Retry-After:
          $ref: "#/components/headers/Retry-After8"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsRateLimitError"
    Response48:
      description:
        "internal_error: no credentials or storage details. A Cloud-side handler failure does
        not consume daily quota and retains the remaining-quota estimate header."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsInternalError"
    Response49:
      description:
        "quota_unavailable: no confirmed valid reserved lease; fail closed before entering the
        handler. Retry-After: 30 is required."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        Retry-After:
          $ref: "#/components/headers/Retry-After9"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsQuotaUnavailableError"
    Response50:
      description: Success.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit2"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsService"
    Response51:
      description: Deleted; no response body.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit2"
    Response52:
      description: Success.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit2"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsPolicy"
    Response53:
      description: Success.
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control5"
        X-Quota-Daily-Remaining:
          $ref: "#/components/headers/X-Quota-Daily-Remaining5"
        X-RateLimit-Limit:
          $ref: "#/components/headers/X-RateLimit-Limit2"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PmsRolePolicy"
  parameters:
    serviceName:
      name: serviceName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$
      description: Exact (case-sensitive) name of a service of the API key's account; otherwise 404.
      example: books
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        anyOf:
          - type: string
            minLength: 26
            maxLength: 26
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          - type: string
            minLength: 36
            maxLength: 36
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: Cloud policy ID (canonical uppercase ULID, or legacy lowercase UUIDv7). Never a policy name.
      example: 01HF7YAT000000000000000001
  requestBodies:
    RequestBody7:
      required: true
      description:
        "application/json Speedle JsonContext, at most 64 KiB before parsing. Attributes are an
        array of {name, type, value} with Speedle types string, numeric, bool and datetime (or an
        omitted type for an unconverted value), each a single value or an array of values of that
        type; Cloud bounds them to 50 items and 16,384 canonical UTF-8 JSON bytes. The Go decoder,
        not this schema, decides validity: unknown fields are ignored and field names match
        case-insensitively, as in Speedle."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsRequest"
