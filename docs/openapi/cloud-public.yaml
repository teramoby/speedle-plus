  /policy-mgmt/v1/service:
    get:
      operationId: pmsListServices
      summary: List the account's services
      description:
        "API-key-authenticated Speedle PMS compatibility API (#250). Requires `Authorization:
        Bearer <API key>`; API keys are account-level (#374), so the path serviceName selects a
        service of the key's account; session cookies and CSRF headers are never accepted. Order:
        bearer verification (401), fixed-scope authorization (403 insufficient_scope), per-API-key
        burst limit (429 rate_limited), account daily quota (429 daily_quota_exceeded or 503
        quota_unavailable), then business validation. Every admitted non-5xx request consumes one
        PMS/ADS account quota unit, including reads and business rejections; a Cloud-side handler
        5xx is refunded only when the independent relief ledger approves it within the per-account
        daily cap, and auth, scope, routing, size, burst and reservation rejections are uncharged.
        Mutations and their audit rows commit atomically and republish the service snapshot. Never
        give manage mode (pms:write) to an agent governed by these policies: it can change the
        policies that decide its own access. Upstream GET /service. API keys are account-level: a
        valid key sees every service of its account, oldest first, and [] when the account has none.
        Each service includes its policies and role policies in upstream PMS shape."
      security:
        - pmsToken: []
      parameters: []
      responses:
        "200":
          description: Success.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control5"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining5"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PmsServiceList"
        "400":
          $ref: "#/components/responses/Response41"
        "401":
          $ref: "#/components/responses/Response42"
        "403":
          $ref: "#/components/responses/Response43"
        "404":
          $ref: "#/components/responses/Response44"
        "409":
          $ref: "#/components/responses/Response45"
        "413":
          $ref: "#/components/responses/Response46"
        "429":
          $ref: "#/components/responses/Response47"
        "500":
          $ref: "#/components/responses/Response48"
        "503":
          $ref: "#/components/responses/Response49"
    post:
      operationId: pmsCreateService
      summary: Create a service in the API key's account
      description:
        "API-key-authenticated Speedle PMS compatibility API (#250). Requires `Authorization:
        Bearer <API key>`; API keys are account-level (#374), so the path serviceName selects a
        service of the key's account; session cookies and CSRF headers are never accepted. Order:
        bearer verification (401), fixed-scope authorization (403 insufficient_scope), per-API-key
        burst limit (429 rate_limited), account daily quota (429 daily_quota_exceeded or 503
        quota_unavailable), then business validation. Every admitted non-5xx request consumes one
        PMS/ADS account quota unit, including reads and business rejections; a Cloud-side handler
        5xx is refunded only when the independent relief ledger approves it within the per-account
        daily cap, and auth, scope, routing, size, burst and reservation rejections are uncharged.
        Mutations and their audit rows commit atomically and republish the service snapshot. Never
        give manage mode (pms:write) to an agent governed by these policies: it can change the
        policies that decide its own access. Upstream POST /service. Creates a service in the API
        key's account. The insert itself requires the key to still be active, so a key revoked after
        a cached verification cannot create a service: that request returns 401 unauthorized. An
        account may own up to 100 services with unique names: a duplicate name returns 409
        service_exists and the technical cap returns 409 quota_exceeded with limit 100. Success
        stores the service, writes service.create audit and publishes its empty snapshot."
      security:
        - pmsToken: []
      parameters: []
      requestBody:
        required: true
        description:
          application/json only, at most 64 KiB. The body is upstream PMS JSON, not SPDL; it is
          rendered to one SPDL statement and re-parsed before writing. Reject unknown fields.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmsServiceWrite"
      responses:
        "201":
          $ref: "#/components/responses/Response50"
        "400":
          $ref: "#/components/responses/Response41"
        "401":
          $ref: "#/components/responses/Response42"
        "403":
          $ref: "#/components/responses/Response43"
        "404":
          $ref: "#/components/responses/Response44"
        "409":
          $ref: "#/components/responses/Response45"
        "413":
          $ref: "#/components/responses/Response46"
        "429":
          $ref: "#/components/responses/Response47"
        "500":
          $ref: "#/components/responses/Response48"
        "503":
          $ref: "#/components/responses/Response49"
  /policy-mgmt/v1/service/{serviceName}:
    get:
      operationId: pmsGetService
      summary: Get a service of the account
      description:
        "API-key-authenticated Speedle PMS compatibility API (#250). Requires `Authorization:
        Bearer <API key>`; API keys are account-level (#374), so the path serviceName selects a
        service of the key's account; session cookies and CSRF headers are never accepted. Order:
        bearer verification (401), fixed-scope authorization (403 insufficient_scope), per-API-key
