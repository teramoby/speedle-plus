        Mutations and their audit records are written atomically. Policy changes reach authorization
        checks within about 60 seconds.


        Creates a policy from the request body. The body is converted to one SPDL statement; a body
        that cannot be represented or does not parse returns 400 without writing. The name is a
        display attribute and need not be unique; the server-generated ID identifies the policy. The
        account allows 200 policies combined across authorization and role policies; exceeding it
        returns 409 quota_exceeded with limit 200.
      security:
        - pmsToken: []
      parameters:
        - $ref: "#/components/parameters/serviceName"
      requestBody:
        required: true
        description: JSON body, at most 64 KiB. Unknown fields are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmsPolicyWrite"
      responses:
