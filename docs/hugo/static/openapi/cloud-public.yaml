openapi: 3.1.0
info:
  title: Speedle Cloud API
  version: 0.4.0
  description: Run authorization checks and manage policies with Speedle Cloud API keys.
servers:
  - url: https://cloud.speedle.io
    description: production
tags:
  - name: Authorization checks
    description:
      Check whether a subject is allowed to perform an action, and list the roles or
      permissions granted to a subject.
  - name: Policy management
    description: Create, read and delete services, policies and role policies for an account.
paths:
  /authz-check/v1/is-allowed:
    post:
      operationId: ads-is-allowed
      summary: Check authorization in the service the request names
      description: >-
        Checks authorization against the policies of one service. Send an API key with the ads scope
        as `Authorization: Bearer <key>`. The key determines the account, and the required
        `serviceName` in the body selects one of that account's services. A missing, empty or
        unknown service returns 404 service_not_found. An account-scoped instance credential
        (`adsi_...`) may also call this endpoint for the services in its instance's set.


        The body is a Speedle JsonContext: subject, serviceName, resource, action and optional typed
        attributes. Decisions use subject.principals; subject.token and tokenType are accepted but
        not validated. Requests are limited to 64 KiB and 50 attributes, and the per-key burst limit
        is 600 requests per 60 seconds. Every admitted call counts against the account's 10,000-call
        daily quota, shared by all of its services, keys and sessions and resetting at 00:00 UTC.
        Rejections for authentication, scope, routing, size, burst and quota are not charged.
        Rate-limited responses include Retry-After.


        Returns the decision as `allowed` (true for a grant, false for a denial) and `reason` (a
        Speedle reason code). Evaluation errors are returned as a denial with `errorMessage`.
      security:
        - apiToken: []
        - adsInstanceCredential: []
      requestBody:
        $ref: "#/components/requestBodies/RequestBody7"
      responses:
        "200":
          description: The result of the authorization check.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control4"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining3"
            X-Speedle-Decision-Source:
              $ref: "#/components/headers/X-Speedle-Decision-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsDecision"
        "400":
          $ref: "#/components/responses/Response32"
        "401":
          $ref: "#/components/responses/Response33"
        "403":
          $ref: "#/components/responses/Response34"
        "404":
          $ref: "#/components/responses/Response35"
        "405":
          $ref: "#/components/responses/Response36"
        "413":
          $ref: "#/components/responses/Response37"
        "429":
          $ref: "#/components/responses/Response38"
        "500":
          $ref: "#/components/responses/Response39"
        "503":
          $ref: "#/components/responses/Response40"
      tags:
        - Authorization checks
  /authz-check/v1/all-granted-roles:
    post:
      operationId: ads-all-granted-roles
      summary: List granted roles in the service the request names
      description: >-
        Checks authorization against the policies of one service. Send an API key with the ads scope
        as `Authorization: Bearer <key>`. The key determines the account, and the required
        `serviceName` in the body selects one of that account's services. A missing, empty or
        unknown service returns 404 service_not_found. An account-scoped instance credential
        (`adsi_...`) may also call this endpoint for the services in its instance's set.


        The body is a Speedle JsonContext: subject, serviceName, resource, action and optional typed
        attributes. Decisions use subject.principals; subject.token and tokenType are accepted but
        not validated. Requests are limited to 64 KiB and 50 attributes, and the per-key burst limit
        is 600 requests per 60 seconds. Every admitted call counts against the account's 10,000-call
        daily quota, shared by all of its services, keys and sessions and resetting at 00:00 UTC.
        Rejections for authentication, scope, routing, size, burst and quota are not charged.
        Rate-limited responses include Retry-After.


        Returns the role names granted to the request's subject as a string array, empty when none.
        An evaluation error returns the Speedle error body `{error: message}`.
      security:
        - apiToken: []
        - adsInstanceCredential: []
      requestBody:
        $ref: "#/components/requestBodies/RequestBody7"
      responses:
        "200":
          description: The result of the authorization check.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control4"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining3"
            X-Speedle-Decision-Source:
              $ref: "#/components/headers/X-Speedle-Decision-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsRoles"
        "400":
          $ref: "#/components/responses/Response32"
        "401":
          $ref: "#/components/responses/Response33"
        "403":
          $ref: "#/components/responses/Response34"
        "404":
          $ref: "#/components/responses/Response35"
        "405":
          $ref: "#/components/responses/Response36"
        "413":
          $ref: "#/components/responses/Response37"
        "429":
          $ref: "#/components/responses/Response38"
        "500":
          $ref: "#/components/responses/Response39"
        "503":
          $ref: "#/components/responses/Response40"
      tags:
        - Authorization checks
  /authz-check/v1/all-granted-permissions:
    post:
      operationId: ads-all-granted-permissions
      summary: List granted permissions in the service the request names
      description: >-
        Checks authorization against the policies of one service. Send an API key with the ads scope
        as `Authorization: Bearer <key>`. The key determines the account, and the required
        `serviceName` in the body selects one of that account's services. A missing, empty or
        unknown service returns 404 service_not_found. An account-scoped instance credential
        (`adsi_...`) may also call this endpoint for the services in its instance's set.


        The body is a Speedle JsonContext: subject, serviceName, resource, action and optional typed
        attributes. Decisions use subject.principals; subject.token and tokenType are accepted but
        not validated. Requests are limited to 64 KiB and 50 attributes, and the per-key burst limit
        is 600 requests per 60 seconds. Every admitted call counts against the account's 10,000-call
        daily quota, shared by all of its services, keys and sessions and resetting at 00:00 UTC.
        Rejections for authentication, scope, routing, size, burst and quota are not charged.
        Rate-limited responses include Retry-After.


        Returns the permissions granted to the request's subject as `{resource, actions}` items,
        empty when none. An evaluation error returns the Speedle error body `{error: message}`.
      security:
        - apiToken: []
        - adsInstanceCredential: []
      requestBody:
        $ref: "#/components/requestBodies/RequestBody7"
      responses:
        "200":
          description: The result of the authorization check.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control4"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining3"
            X-Speedle-Decision-Source:
              $ref: "#/components/headers/X-Speedle-Decision-Source"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdsPermissions"
        "400":
          $ref: "#/components/responses/Response32"
        "401":
          $ref: "#/components/responses/Response33"
        "403":
          $ref: "#/components/responses/Response34"
        "404":
          $ref: "#/components/responses/Response35"
        "405":
          $ref: "#/components/responses/Response36"
        "413":
          $ref: "#/components/responses/Response37"
        "429":
          $ref: "#/components/responses/Response38"
        "500":
          $ref: "#/components/responses/Response39"
        "503":
          $ref: "#/components/responses/Response40"
      tags:
        - Authorization checks
  /policy-mgmt/v1/service:
    get:
      operationId: pmsListServices
      summary: List the account's services
      description: >-
        Manages the policies of a service with a policy-management API key. Send the key as
        `Authorization: Bearer <key>`. The key determines the account; operations that address a
        service use its `serviceName` path parameter. The key's scope must allow the operation:
        pms:read for list and get, pms:write for create and delete.


        Request bodies are limited to 64 KiB, and each key to 600 requests per 60 seconds. Every
        admitted call counts against the account's 10,000-call daily quota, shared by all of the
        account's services, keys and sessions and resetting at 00:00 UTC. Rejections for
        authentication, scope, size, burst and quota are not charged. Error responses include
        Retry-After where applicable.


        Mutations and their audit records are written atomically. Policy changes reach authorization
        checks within about 60 seconds.


        Returns every service of the key's account, oldest first, each with its policies and role
        policies; an empty array when the account has none.
      security:
        - pmsToken: []
      parameters: []
      responses:
        "200":
          description: Success.
          headers:
            Cache-Control:
              $ref: "#/components/headers/Cache-Control5"
            X-Quota-Daily-Remaining:
              $ref: "#/components/headers/X-Quota-Daily-Remaining3"
            X-RateLimit-Limit:
              $ref: "#/components/headers/X-RateLimit-Limit2"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PmsServiceList"
        "400":
          $ref: "#/components/responses/Response41"
        "401":
          $ref: "#/components/responses/Response42"
        "403":
          $ref: "#/components/responses/Response43"
        "404":
          $ref: "#/components/responses/Response44"
        "409":
          $ref: "#/components/responses/Response45"
        "413":
          $ref: "#/components/responses/Response46"
        "429":
          $ref: "#/components/responses/Response47"
        "500":
          $ref: "#/components/responses/Response48"
        "503":
          $ref: "#/components/responses/Response49"
      tags:
        - Policy management
    post:
      operationId: pmsCreateService
      summary: Create a service in the API key's account
      description: >-
        Manages the policies of a service with a policy-management API key. Send the key as
        `Authorization: Bearer <key>`. The key determines the account; operations that address a
        service use its `serviceName` path parameter. The key's scope must allow the operation:
        pms:read for list and get, pms:write for create and delete.


        Request bodies are limited to 64 KiB, and each key to 600 requests per 60 seconds. Every
        admitted call counts against the account's 10,000-call daily quota, shared by all of the
        account's services, keys and sessions and resetting at 00:00 UTC. Rejections for
        authentication, scope, size, burst and quota are not charged. Error responses include
        Retry-After where applicable.


        Mutations and their audit records are written atomically. Policy changes reach authorization
        checks within about 60 seconds.


        Creates a service in the key's account. The name must be unique in the account, which can
        own up to 100 services; a duplicate returns 409 service_exists and the cap returns 409
        quota_exceeded with limit 100. The key must still be active when the request is processed.
      security:
        - pmsToken: []
      parameters: []
      requestBody:
        required: true
        description: JSON body, at most 64 KiB. Unknown fields are rejected.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmsServiceWrite"
      responses:
        "201":
          $ref: "#/components/responses/Response50"
        "400":
          $ref: "#/components/responses/Response41"
        "401":
          $ref: "#/components/responses/Response42"
        "403":
          $ref: "#/components/responses/Response43"
        "404":
          $ref: "#/components/responses/Response44"
        "409":
          $ref: "#/components/responses/Response45"
        "413":
          $ref: "#/components/responses/Response46"
        "429":
          $ref: "#/components/responses/Response47"
        "500":
          $ref: "#/components/responses/Response48"
        "503":
          $ref: "#/components/responses/Response49"
      tags:
        - Policy management
  /policy-mgmt/v1/service/{serviceName}:
