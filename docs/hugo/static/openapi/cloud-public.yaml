    Response38:
      description:
        "rate_limited: the per-key burst limit of 600 requests per 60 seconds was exceeded.
        daily_quota_exceeded: the account's daily quota is exhausted. Both include Retry-After."
      headers:
        Cache-Control:
          $ref: "#/components/headers/Cache-Control4"
