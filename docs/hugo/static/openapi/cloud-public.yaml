  securitySchemes:
    pmsToken:
      type: http
      scheme: bearer
      bearerFormat: spdl_<canonical uppercase ULID>_<43 base62 digits>
      description:
        "Account-level policy-management API key created in the console. Its fixed scope is
        pms:read (list and get) or pms:write (also create and delete policies and services), and it
        reaches every service of its account. Keys with the ads scope are rejected with 403
        insufficient_scope. Send it as `Authorization: Bearer <key>`. The key is shown once when
        created, expires at the time selected at creation, and can be revoked. Do not give a
        pms:write key to an agent whose access is governed by these policies: it could change the
        policies that decide its own access."
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: spdl_<canonical uppercase ULID>_<43 base62 digits>
      description:
        "Account-level API key with the ads scope. It authorizes authorization checks for every
        service of its account; the serviceName in each request selects the service. It never
        authorizes policy management or account administration, and pms:read/pms:write keys return
        403 insufficient_scope. Send it as a single `Authorization: Bearer <key>` header. The key is
        shown once when created, expires at the time selected at creation, and can be revoked; a
        revoked key stops working within 60 seconds, while an expired key stops authorizing at its
        expiry time. Deleting a service does not revoke API keys."
    adsInstanceCredential:
      type: http
      scheme: bearer
      bearerFormat: adsi_<canonical uppercase ULID instanceId>_<43 base62 digits>
      description:
        "Account-scoped, read-only instance credential (75 characters). It authorizes the
        policy-source sync API, the instance channel and authorization checks for services in the
        instance's service set, and nothing else: no policy management, no token issuance, no
        service outside the set. The credential is shown once when it is created and can be revoked
        per instance; a revoked credential stops working within 60 seconds. It never appears in a
        URL, log or event."
  headers:
    Cache-Control4:
      schema:
        type: string
        const: no-store
      example: no-store
    X-RateLimit-Limit:
      schema:
        type: string
        const: "600"
      example: "600"
      description:
        "Per-key limit: 600 requests per 60 seconds. Present once the credential is verified;
        early size or authentication failures may omit it."
    X-Quota-Daily-Remaining3:
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
      example: "9999"
      description:
        Approximate number of calls left in the account's daily quota. Resets at 00:00 UTC.
        Informational only; omitted when the request is rejected before it is processed.
    X-Speedle-Decision-Source:
      schema:
        type: string
        const: cloud-fallback
      example: cloud-fallback
      description:
        Present only on responses to requests authenticated with an adsi_ instance credential.
        Informational; never use it to make a security decision.
    WWW-Authenticate:
      schema:
        type: string
        const: Bearer
      example: Bearer
    Allow:
      schema:
        type: string
        const: POST
      example: POST
      description: The only method these paths accept.
    Retry-After6:
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: string
        pattern: ^[1-9][0-9]*$
        description:
          A positive whole number of seconds to wait before retrying. For an exhausted daily
          quota, this is the time until the next 00:00 UTC.
      description:
        "Positive number of seconds to wait before retrying. rate_limited: 60;
        daily_quota_exceeded: the time until the next 00:00 UTC."
      example: "60"
    X-Quota-Daily-Remaining4:
      schema:
        type: string
        pattern: ^(0|[1-9][0-9]*)$
      example: "9999"
      description:
        Present only for snapshot_unavailable. Omitted for quota_unavailable and
        fallback_unavailable. Approximate number of calls left in the account's daily quota. Resets
        at 00:00 UTC. Informational only; omitted when the request is rejected before it is
        processed.
    Retry-After7:
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        type: string
        pattern: ^[1-9][0-9]*$
        description:
          A positive whole number of seconds to wait before retrying. For an exhausted daily
          quota, this is the time until the next 00:00 UTC.
      description:
        "quota_unavailable: 30. fallback_unavailable: 30, or the time until the next 00:00 UTC
        when the instance's daily allowance is exhausted. Not sent with snapshot_unavailable."
      example: "30"
    Cache-Control5:
      schema:
        type: string
        const: no-store
      example: no-store
      description: Management responses must not be cached.
    X-RateLimit-Limit2:
      schema:
        type: string
        const: "600"
      example: "600"
      description:
        "Per-key limit: 600 requests per 60 seconds. Present once the credential is verified;
        early failures may omit it."
    Retry-After8:
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description:
        "Positive number of seconds to wait before retrying. rate_limited: 60;
        daily_quota_exceeded: the time until the next 00:00 UTC."
      example: "60"
    Retry-After9:
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
      description: "quota_unavailable: 30."
      example: "30"
  responses:
    Response32:
      description:
