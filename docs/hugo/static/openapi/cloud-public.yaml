        Mutations and their audit records are written atomically. Policy changes reach authorization
        checks within about 60 seconds.


        Returns one service by its exact name. An unknown name or another account's service returns
        404 not_found.
      security:
        - pmsToken: []
      parameters:
        - $ref: "#/components/parameters/serviceName"
      responses:
        "200":
          $ref: "#/components/responses/Response50"
        "400":
          $ref: "#/components/responses/Response41"
        "401":
          $ref: "#/components/responses/Response42"
        "403":
          $ref: "#/components/responses/Response43"
        "404":
          $ref: "#/components/responses/Response44"
        "409":
          $ref: "#/components/responses/Response45"
        "413":
          $ref: "#/components/responses/Response46"
        "429":
          $ref: "#/components/responses/Response47"
        "500":
          $ref: "#/components/responses/Response48"
        "503":
          $ref: "#/components/responses/Response49"
      tags:
        - Policy management
    delete:
      operationId: pmsDeleteService
      summary: Delete a service of the account
      description: >-
        Manages the policies of a service with a policy-management API key. Send the key as
        `Authorization: Bearer <key>`. The key determines the account; operations that address a
        service use its `serviceName` path parameter. The key's scope must allow the operation:
        pms:read for list and get, pms:write for create and delete.


        Request bodies are limited to 64 KiB, and each key to 600 requests per 60 seconds. Every
        admitted call counts against the account's 10,000-call daily quota, shared by all of the
        account's services, keys and sessions and resetting at 00:00 UTC. Rejections for
