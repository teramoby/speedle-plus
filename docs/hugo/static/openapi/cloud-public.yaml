  parameters:
    serviceName:
      name: serviceName
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$
      description: Exact (case-sensitive) name of a service of the API key's account; otherwise 404.
      example: books
    policyId:
      name: policyId
      in: path
      required: true
      schema:
        $schema: https://json-schema.org/draft/2020-12/schema
        anyOf:
          - type: string
            minLength: 26
            maxLength: 26
            pattern: ^[0-7][0-9A-HJKMNP-TV-Z]{25}$
          - type: string
            minLength: 36
            maxLength: 36
            pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
      description: "Policy ID: a canonical uppercase ULID, or a legacy lowercase UUIDv7. Never a policy name."
      example: 01HF7YAT000000000000000001
  requestBodies:
    RequestBody7:
      required: true
      description:
        "JSON body, at most 64 KiB. A Speedle JsonContext: subject, serviceName, resource,
        action and optional typed attributes as `{name, type, value}` objects. Supported types are
        string, numeric, bool and datetime (or no type to pass the value through); each value is a
        single value or an array of values of that type. At most 50 attributes and 16,384 UTF-8
        bytes. Unknown fields are ignored and field names are case-insensitive, as in Speedle."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdsRequest"
