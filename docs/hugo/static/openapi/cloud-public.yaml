components:
  schemas:
    AdsRequest:
      type: object
      properties:
        subject:
          anyOf:
            - type: object
              properties:
                principals:
                  anyOf:
                    - type: array
                      items:
                        type: object
                        properties:
                          type:
                            type: string
                          name:
                            type: string
                          idd:
                            type: string
                        additionalProperties: {}
                    - type: "null"
                tokenType:
                  type: string
                token:
                  type: string
              additionalProperties: {}
            - type: "null"
        serviceName:
          type: string
          description:
            "Required in every request: the name of the service to evaluate, within the API key's
            account. It is never defaulted; a missing, empty or unknown service returns 404
            service_not_found."
        resource:
          type: string
        action:
          type: string
        attributes:
          description: Typed attributes. At most 50 items and 16,384 UTF-8 bytes of JSON.
          anyOf:
            - maxItems: 50
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  type:
                    anyOf:
                      - type: string
                        enum:
                          - string
                          - numeric
                          - bool
                          - datetime
                        description:
                          "string: a JSON string. numeric: a JSON number. bool: true or false. datetime: a
                          date-time string in RFC 3339 or another supported Speedle layout,
                          converted to Unix seconds. Omit the type to pass the JSON value through
                          unconverted."
                      - type: string
                        const: ""
                  value:
                    description:
                      A single value of the declared type, or an array of such values. null, null items and
                      mixed types return 400.
                    $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
                required:
                  - name
                  - value
                additionalProperties: {}
                description: "One typed attribute: `{name, type, value}`."
            - type: "null"
      required:
        - serviceName
      additionalProperties: {}
      description:
        "A Speedle authorization request: the subject, the service, and the resource and action
        to check."
      $defs:
        __schema0:
          anyOf:
            - type: string
            - type: number
            - type: boolean
            - type: "null"
            - type: array
              items:
                $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
            - type: object
              propertyNames:
                type: string
              additionalProperties:
                $ref: "#/components/schemas/AdsRequest/$defs/__schema0"
      examples:
        - subject:
            principals:
              - type: user
                name: alice
          serviceName: books
          resource: /books/123
          action: get
        - subject:
            principals:
              - type: user
                name: alice
          serviceName: books
          resource: /books/123
          action: get
          attributes:
            - name: team
              type: string
              value: engineering
            - name: level
              type: numeric
              value: 3
            - name: active
              type: bool
              value: true
            - name: when
              type: datetime
              value: 2026-11-05T03:00:00Z
            - name: tags
              type: string
              value:
                - a
                - b
    AdsDecision:
      type: object
      properties:
        allowed:
          type: boolean
        reason:
          type: integer
          minimum: 0
          maximum: 6
        errorMessage:
          type: string
      required:
        - allowed
        - reason
      additionalProperties: false
      examples:
        - allowed: true
          reason: 0
        - allowed: false
          reason: 3
    AdsRoles:
      type: array
      items:
        type: string
      examples:
        - []
        - - reader
    AdsPermissions:
      type: array
      items:
        type: object
        properties:
          resource:
            type: string
          actions:
            anyOf:
              - type: array
                items:
                  type: string
              - type: "null"
        required:
          - resource
          - actions
        additionalProperties: false
      examples:
        - []
        - - resource: /books
            actions:
              - get
    AdsInvalidRequestError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
      additionalProperties: false
      examples:
        - error: SPDL-0004 value "2026-11-05" is not a supported date time
        - error:
            "SPDL-0004 unable to decode request: json: cannot unmarshal object into Go struct field
            JsonContext.attributes of type []*adsrest.JsonAttribute"
    AdsUnauthorizedError:
      anyOf:
        - type: object
          properties:
            error:
              type: string
              enum:
                - unauthorized
          required:
            - error
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
              enum:
                - api_key_expired
          required:
            - error
          additionalProperties: false
      examples:
        - error: unauthorized
        - error: api_key_expired
    AdsMethodNotAllowedError:
      type: object
      properties:
        error:
          type: string
          enum:
            - method_not_allowed
      required:
        - error
      additionalProperties: false
      examples:
        - error: method_not_allowed
    AdsForbiddenError:
      anyOf:
        - type: object
          properties:
            error:
              type: string
              enum:
                - insufficient_scope
          required:
            - error
          additionalProperties: false
        - type: object
          properties:
            error:
              type: string
          required:
            - error
          additionalProperties: false
      examples:
        - error: insufficient_scope
    AdsRequestTooLargeError:
      type: object
      properties:
        error:
          type: string
          enum:
            - request_too_large
      required:
        - error
      additionalProperties: false
      examples:
        - error: request_too_large
    AdsServiceNotFoundError:
