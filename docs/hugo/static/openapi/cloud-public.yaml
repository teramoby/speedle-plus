            - deny
        permissions:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              resource:
                type: string
                minLength: 1
              resourceExpression:
                type: string
                minLength: 1
              actions:
                minItems: 1
                type: array
                items:
                  type: string
                  minLength: 1
            required:
              - actions
            additionalProperties: false
            description:
              A permission. Set exactly one of resource (an exact match) or resourceExpression (a
              regular expression).
        principals:
          minItems: 1
          type: array
          items:
            minItems: 1
            type: array
            items:
              type: string
              pattern: ^(?:idd=[^\r\n\u2028\u2029]+:(?:user|group|role|entity):[^\r\n\u2028\u2029]+|(?:user|group|role|entity):[^\r\n\u2028\u2029]+)$
              description:
                'An encoded principal: "<type>:<name>" or "idd=<idd>:<type>:<name>", where type is
                user, group, role or entity.'
        condition:
          type: string
      required:
        - name
        - effect
        - permissions
        - principals
      additionalProperties: false
      examples:
        - name: read-books
          effect: grant
          permissions:
            - resource: /books
              actions:
                - get
                - list
          principals:
            - - user:alice
