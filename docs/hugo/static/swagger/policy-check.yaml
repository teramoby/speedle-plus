basePath: /authz-check/v1
definitions:
  AllPermissionResponse:
    items:
      properties:
        actions:
          items:
            type: string
          type: array
        resource:
          type: string
      type: object
    type: array
  AllRoleResponse:
    items:
      type: string
    type: array
  AndPrincipals:
    items:
      type: string
    type: array
  Attribute:
    properties:
      name:
        type: string
      type:
        enum:
          - string
          - bool
          - numeric
          - datetime
        type: string
      value: {}
    type: object
  ContextRequest:
    properties:
      action:
        type: string
      attributes:
        items:
          $ref: '#/definitions/Attribute'
        type: array
        x-nullable: true
      resource:
        type: string
      serviceName:
        type: string
      subject:
        $ref: '#/definitions/Subject'
    required:
      - subject
      - serviceName
    type: object
  DiagnoseResponse:
    properties:
      allowed:
        type: boolean
      attributes:
        additionalProperties: {}
        type: object
      grantedRoles:
        items:
          type: string
        type: array
      policies:
        items:
          $ref: '#/definitions/PolicyResponse'
        type: array
      reason:
        type: string
      requestContext:
        $ref: '#/definitions/ContextRequest'
      rolePolicies:
        items:
          $ref: '#/definitions/RolePolicyResponse'
        type: array
    type: object
  EffectEnum:
    enum:
      - grant
      - deny
    type: string
  Error:
    properties:
      error:
        type: string
    type: object
  IsAllowedResponse:
    properties:
      allowed:
        type: boolean
      errorMessage:
        type: string
      reason:
        format: int32
        type: integer
    type: object
  PolicyResponse:
    properties:
      condition:
        description: Condition details when present; an empty object when the policy has no condition.
        properties:
          conditionExpression:
            type: string
          evaluationResult:
            type: string
        type: object
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          properties:
            actions:
              items:
                type: string
              type: array
            resource:
              type: string
            resourceExpression:
              type: string
          type: object
        type: array
      principals:
        $ref: '#/definitions/Principals'
      status:
        type: string
    type: object
  Principal:
    properties:
      idd:
        type: string
      name:
        type: string
      type:
        enum:
          - user
          - group
          - entity
        type: string
    type: object
  Principals:
    items:
      $ref: '#/definitions/AndPrincipals'
    type: array
  RolePolicyResponse:
    properties:
      condition:
        description: Condition details when present; an empty object when the policy has no condition.
        properties:
          conditionExpression:
            type: string
          evaluationResult:
            type: string
        type: object
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      name:
        type: string
      principals:
        items:
          type: string
        type: array
      resourceExpressions:
        items:
          type: string
        type: array
      resources:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  Subject:
    properties:
      principals:
        items:
          $ref: '#/definitions/Principal'
        type: array
      token:
        type: string
      tokenType:
        type: string
    type: object
info:
  description: JSON REST APIs for the configured ADS endpoint. These are reference contracts, not APIs hosted by speedle.io. Authenticate callers at a trusted gateway or use mutual TLS; there is no built-in bearer-header authorization.
  title: Authorization decision API
  version: v1
paths:
  /all-granted-permissions:
    post:
      consumes:
        - application/json
      description: Get granted permissions for a subject
      operationId: getAllGrantedPermissions
      parameters:
        - description: Request Context of getAllGrantedPermissions
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/AllPermissionResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get granted permissions for a subject
      tags:
        - getAllGrantedPermissions
  /all-granted-roles:
    post:
      consumes:
        - application/json
      description: Get granted roles for a subject
      operationId: getAllGrantedRoles
      parameters:
        - description: Request Context of getAllGrantedRoles
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/AllRoleResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get granted roles for a subject
      tags:
        - getAllGrantedRoles
  /diagnose:
    post:
      consumes:
        - application/json
      description: Diagnose a policy decision
      operationId: diagnose
      parameters:
        - description: Request Context of isAllowed
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/DiagnoseResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Diagnose a policy decision
      tags:
        - diagnosis
  /discover:
    post:
      consumes:
        - application/json
      description: Record a request without enforcing authorization
      operationId: discover
      parameters:
        - description: Request Context of isAllowed
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/IsAllowedResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Record a request without enforcing authorization
      tags:
        - policy discovery
  /is-allowed:
    post:
      consumes:
        - application/json
      description: Evaluate whether a request is allowed
      operationId: isAllowed
      parameters:
        - description: Request Context of isAllowed
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/IsAllowedResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Evaluate whether a request is allowed
      tags:
        - isAllowed
schemes:
  - https
  - http
swagger: "2.0"
