basePath: /authz-check/v1
definitions:
  AllPermissionResponse:
    items:
      properties:
        actions:
          items:
            type: string
          type: array
        resource:
          type: string
      type: object
    type: array
  AllRoleResponse:
    items:
      type: string
    type: array
  AndPrincipals:
    items:
      type: string
    type: array
  Attribute:
    properties:
      name:
        type: string
      type:
        enum:
          - string
          - bool
          - numeric
          - datetime
        type: string
      value: {}
    type: object
  ContextRequest:
    properties:
      action:
        type: string
      attributes:
        items:
          $ref: '#/definitions/Attribute'
        type: array
        x-nullable: true
      resource:
        type: string
      serviceName:
        type: string
      subject:
        $ref: '#/definitions/Subject'
    required:
      - subject
      - serviceName
    type: object
  DiagnoseResponse:
    properties:
      allowed:
        type: boolean
      attributes:
        additionalProperties: {}
        type: object
      grantedRoles:
        items:
          type: string
        type: array
      policies:
        items:
          $ref: '#/definitions/PolicyResponse'
        type: array
      reason:
        type: string
      requestContext:
        $ref: '#/definitions/ContextRequest'
      rolePolicies:
        items:
          $ref: '#/definitions/RolePolicyResponse'
        type: array
    type: object
  EffectEnum:
    enum:
      - grant
      - deny
    type: string
  Error:
    properties:
      error:
        type: string
    type: object
  IsAllowedResponse:
    properties:
      allowed:
        type: boolean
      errorMessage:
        type: string
      reason:
        format: int32
        type: integer
    type: object
  PolicyResponse:
    properties:
      condition:
        description: 有条件时返回条件明细；策略无条件时为空对象。
        properties:
          conditionExpression:
            type: string
          evaluationResult:
            type: string
        type: object
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      name:
        type: string
      permissions:
        items:
          properties:
            actions:
              items:
                type: string
              type: array
            resource:
              type: string
            resourceExpression:
              type: string
          type: object
        type: array
      principals:
        $ref: '#/definitions/Principals'
      status:
        type: string
    type: object
  Principal:
    properties:
      idd:
        type: string
      name:
        type: string
      type:
        enum:
          - user
          - group
          - entity
        type: string
    type: object
  Principals:
    items:
      $ref: '#/definitions/AndPrincipals'
    type: array
  RolePolicyResponse:
    properties:
      condition:
        description: 有条件时返回条件明细；策略无条件时为空对象。
        properties:
          conditionExpression:
            type: string
          evaluationResult:
            type: string
        type: object
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      name:
        type: string
      principals:
        items:
          type: string
        type: array
      resourceExpressions:
        items:
          type: string
        type: array
      resources:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
      status:
        type: string
    type: object
  Subject:
    properties:
      principals:
        items:
          $ref: '#/definitions/Principal'
        type: array
      token:
        type: string
      tokenType:
        type: string
    type: object
info:
  description: 用于已配置 ADS 端点的 JSON REST API。本页是接口参考，speedle.io 不托管授权后端。调用方认证应由可信网关或双向 TLS 完成，服务没有内置的 Bearer header 授权。
  title: 授权决策 API
  version: v1
paths:
  /all-granted-permissions:
    post:
      consumes:
        - application/json
      description: 获取主体的已授予权限
      operationId: getAllGrantedPermissions
      parameters:
        - description: JSON 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/AllPermissionResponse'
        "400":
          description: JSON 或请求数据无效
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type 必须为 application/json
        "500":
          description: 评估、断言或存储失败
          schema:
            $ref: '#/definitions/Error'
      summary: 获取主体的已授予权限
      tags:
        - getAllGrantedPermissions
  /all-granted-roles:
    post:
      consumes:
        - application/json
      description: 获取主体的已授予角色
      operationId: getAllGrantedRoles
      parameters:
        - description: JSON 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/AllRoleResponse'
        "400":
          description: JSON 或请求数据无效
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type 必须为 application/json
        "500":
          description: 评估、断言或存储失败
          schema:
            $ref: '#/definitions/Error'
      summary: 获取主体的已授予角色
      tags:
        - getAllGrantedRoles
  /diagnose:
    post:
      consumes:
        - application/json
      description: 诊断策略决策
      operationId: diagnose
      parameters:
        - description: JSON 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/DiagnoseResponse'
        "400":
          description: JSON 或请求数据无效
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type 必须为 application/json
        "500":
          description: 评估、断言或存储失败
          schema:
            $ref: '#/definitions/Error'
      summary: 诊断策略决策
      tags:
        - diagnosis
  /discover:
    post:
      consumes:
        - application/json
      description: 仅用于受控测试；成功时记录请求并返回 allowed=true，不代表正式策略允许访问。无效请求、断言或存储错误仍返回错误。
      operationId: discover
      parameters:
        - description: JSON 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/IsAllowedResponse'
        "400":
          description: JSON 或请求数据无效
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type 必须为 application/json
        "500":
          description: 评估、断言或存储失败
          schema:
            $ref: '#/definitions/Error'
      summary: 记录请求并跳过授权检查
      tags:
        - policy discovery
  /is-allowed:
    post:
      consumes:
        - application/json
      description: 判断请求是否允许
      operationId: isAllowed
      parameters:
        - description: JSON 请求体
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/ContextRequest'
      produces:
        - application/json
      responses:
        "200":
          description: 成功
          schema:
            $ref: '#/definitions/IsAllowedResponse'
        "400":
          description: JSON 或请求数据无效
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type 必须为 application/json
        "500":
          description: 评估、断言或存储失败
          schema:
            $ref: '#/definitions/Error'
      summary: 判断请求是否允许
      tags:
        - isAllowed
schemes:
  - https
  - http
swagger: "2.0"
