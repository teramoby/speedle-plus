{{- if not (.Get "url") -}}
{{- errorf "swagger-spec requires a url on %s" .Page.Path -}}
{{- end -}}
<div id="swagger-ui"{{ if eq (.Get "tryitout") "false" }} class="swagger-readonly"{{ end }}></div>
<script src="/js/swagger-js/swagger-ui-bundle.js" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  var ui = SwaggerUIBundle({
    url: {{ .Get "url" | jsonify | safeJS }},
    dom_id: '#swagger-ui',
    deepLinking: true,
    presets: [
      SwaggerUIBundle.presets.apis
    ],
    plugins: [
      SwaggerUIBundle.plugins.DownloadUrl
    ],
    validatorUrl: null,
    layout: "BaseLayout"{{ if eq (.Get "tryitout") "false" }},
    supportedSubmitMethods: []{{ end }}
  });
  window.ui = ui;
});
</script>
