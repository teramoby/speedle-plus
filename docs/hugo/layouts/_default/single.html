{{ define "main" }}
<div id="main">
  {{ if .Params.icon }}<img class="top-right-icon" src="/img/speedle/{{ .Params.icon }}" alt="">{{ end }}
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}<p class="docs-lead">{{ . }}</p>{{ end }}
  {{ with .Params.bref }}<p>{{ . }}</p>{{ end }}
  <div id="kube-component" class="content">{{ .Content | safeHTML }}</div>
</div>
{{ end }}
