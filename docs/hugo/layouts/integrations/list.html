{{ define "main" }}
<div id="main">
  <img class="top-right-icon" src="/img/speedle/10.Integrations.svg" alt="">
  <h1>{{ .Title }}</h1>
  {{ with .Params.description }}<p class="docs-lead">{{ . }}</p>{{ end }}
  {{ with .Params.bref }}<p>{{ . }}</p>{{ end }}
  {{ with .Content }}<div id="kube-component" class="content">{{ . }}</div>{{ end }}
</div>
{{ end }}
