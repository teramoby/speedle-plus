[AboutSpeedleTitle]
other = "Speedle について"

[AboutSpeedleContent]
other = "Speedle は汎用認可エンジンです。最新のクラウドネイティブアプリケーションからレガシーアプリケーションまで、さまざまなアプリケーションのアクセス制御要件に対応するオープンソースプロジェクトです。ポリシー駆動型のきめ細かなアクセス制御をサポートし、ログインユーザーまたはユーザーを代理するプロセスに対して RBAC/ABAC ポリシーを評価できるポリシーエンジンへアクセス制御ロジックを外部化できます。"

