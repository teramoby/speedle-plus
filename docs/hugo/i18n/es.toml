[FEATURE_CloudNative]
other = "¡Cloud first! Con una gran variedad de ejemplos de integración e interfaces conectables, proteja sus aplicaciones en cualquier proveedor de nube."

[RealtimePolicyDiscovery]
other = "Descubrimiento de políticas en tiempo real"

[FEATURE_RealtimePolicyDiscovery]
other = "Descubra dinámicamente políticas basadas en interacciones en tiempo de ejecución en tiempo real entre sus servicios, sin tener que adivinar todas las posibles vías de acceso de atacantes a sus sistemas."

[FEATURE_RBAC]
other = "Utilice control de acceso detallado basado en roles y atributos para proteger sus aplicaciones."

