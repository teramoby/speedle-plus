[FEATURE_BYOPersistenceStore]
other = "¿Prefiere no usar etcd? Implemente nuestra interfaz de persistencia para utilizar sus almacenes de datos existentes: RDBMS, NoSQL o almacenamiento en bloques."

[AboutSpeedleTitle]
other = "Acerca de Speedle"

[AboutSpeedleContent]
other = "Speedle es un motor de autorización de propósito general. Es un proyecto de código abierto diseñado para abordar los requisitos de control de acceso de diversas aplicaciones, desde modernas aplicaciones nativas de la nube hasta sistemas heredados. Admite un control de acceso detallado basado en políticas que ayuda a externalizar la lógica de control de acceso a un motor de políticas capaz de evaluar políticas RBAC/ABAC para un usuario autenticado o un proceso que actúa en su nombre."

