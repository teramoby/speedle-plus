baseURL = "https://engine.speedle.io/"
languageCode = "en-us"
title = "Speedle"
theme = "kube"
canonifyURLs = "true"
disableHugoGeneratorInject = true
# Dates come from front matter. A commit timestamp or file modification
# time changes when history is rewritten, so neither can feed the generated
# pages.
enableGitInfo = false
description = "Speedle is an open-source authorization engine for centralized RBAC and ABAC policy decisions across cloud-native and legacy applications."
Paginate = 4
pygmentsCodefences = true
pygmentsCodefencesGuessSyntax = true
pygmentsStyle = "dracula"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# Commit metadata and file modification time are not date sources. A lastmod
# value does not become the publication date.
[frontmatter]
  date = ["date", "publishDate"]
  lastmod = ["lastmod", "date", "publishDate"]
  publishDate = ["publishDate", "date"]
  expiryDate = ["expiryDate"]

[languages.en]
  languageCode = "en-us"

[languages.zh]
  languageCode = "zh-cn"

[languages.ja]
  languageCode = "ja-jp"

[languages.ko]
  languageCode = "ko-kr"

[languages.es]
  languageCode = "es-es"

[taxonomies]
  category = "categories"
  version = "versions"
  tag = "tags"

[Params]
  RSSLink = "/index.xml"
  author = "Speedle" # add your company name
  [[Params.languages]]
    name = "English"
    url = "/en"
  [[Params.languages]]
    name = "日本語"
    url = "/ja"
  [[Params.languages]]
    name = "한국어"
    url = "/ko"
  [[Params.languages]]
    name = "Español"
    url = "/es"
  [[Params.languages]]
    name = "中文"
    url = "/zh"

