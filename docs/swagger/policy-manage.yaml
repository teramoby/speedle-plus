basePath: /policy-mgmt/v1
definitions:
  AndPrincipals:
    items:
      type: string
    type: array
  DiscoverPolicies:
    properties:
      revision:
        format: int64
        type: integer
      services:
        items:
          $ref: '#/definitions/Service'
        type: array
        x-nullable: true
    required:
      - services
      - revision
    type: object
  DiscoverRequest:
    description: Response for discover request
    properties:
      requests:
        items:
          $ref: '#/definitions/RequestContext'
        type: array
        x-nullable: true
      revision:
        format: int64
        type: integer
    required:
      - requests
      - revision
    type: object
  EffectEnum:
    enum:
      - grant
      - deny
    type: string
  Error:
    properties:
      error:
        type: string
    type: object
  Function:
    properties:
      ca:
        type: string
      description:
        type: string
      funcURL:
        type: string
      localFuncURL:
        type: string
      name:
        type: string
      resultCachable:
        type: boolean
      resultTTL:
        format: int64
        type: integer
    required:
      - name
      - funcURL
    type: object
  Policy:
    properties:
      condition:
        type: string
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      permissions:
        items:
          properties:
            actions:
              items:
                type: string
              type: array
            resource:
              type: string
            resourceExpression:
              type: string
          type: object
        type: array
      principals:
        $ref: '#/definitions/Principals'
    required:
      - effect
    type: object
  PolicyCounts:
    additionalProperties:
      properties:
        policycount:
          format: int64
          type: integer
        rolePolicycount:
          format: int64
          type: integer
      type: object
    type: object
  PolicyResponse:
    properties:
      condition:
        type: string
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      permissions:
        items:
          properties:
            actions:
              items:
                type: string
              type: array
            resource:
              type: string
            resourceExpression:
              type: string
          type: object
        type: array
      principals:
        $ref: '#/definitions/Principals'
    required:
      - effect
    type: object
  Principal:
    description: Principal of policy evaluation request
    properties:
      idd:
        type: string
      name:
        type: string
      type:
        type: string
    type: object
  Principals:
    items:
      $ref: '#/definitions/AndPrincipals'
    type: array
  RequestContext:
    description: Context of policy evaluation request
    properties:
      action:
        type: string
      attributes:
        additionalProperties: {}
        type: object
      resource:
        type: string
      serviceName:
        type: string
      subject:
        $ref: '#/definitions/Subject'
    type: object
  RolePolicy:
    properties:
      condition:
        type: string
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      principals:
        items:
          type: string
        type: array
      resourceExpressions:
        items:
          type: string
        type: array
      resources:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
    required:
      - effect
      - roles
    type: object
  RolePolicyResponse:
    properties:
      condition:
        type: string
      effect:
        $ref: '#/definitions/EffectEnum'
      id:
        type: string
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      principals:
        items:
          type: string
        type: array
      resourceExpressions:
        items:
          type: string
        type: array
      resources:
        items:
          type: string
        type: array
      roles:
        items:
          type: string
        type: array
    required:
      - effect
      - roles
    type: object
  Service:
    properties:
      metadata:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/Policy'
        type: array
      rolePolicies:
        items:
          $ref: '#/definitions/RolePolicy'
        type: array
      type:
        $ref: '#/definitions/ServiceTypeEnum'
    required:
      - name
    type: object
  ServiceTypeEnum:
    enum:
      - application
      - k8s-cluster
    type: string
  Subject:
    description: Subject of policy evaluation request
    properties:
      principals:
        items:
          $ref: '#/definitions/Principal'
        type: array
      token:
        type: string
      tokenType:
        type: string
    type: object
info:
  description: JSON REST APIs for a configured PMS endpoint. Policy and role-policy responses are flat objects with string IDs. Protect management access with mutual TLS or an authenticated gateway.
  title: Policy management API
  version: v1
paths:
  /discover-policy:
    get:
      description: Generate policies from all recorded requests
      operationId: listDiscoverPolicies
      parameters:
        - description: Filter by principal type
          in: query
          name: principalType
          type: string
        - description: Filter by principal name
          in: query
          name: principalName
          type: string
        - description: Filter by identity domain
          in: query
          name: principalIDD
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/DiscoverPolicies'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: discover request is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Generate policies from all recorded requests
      tags:
        - policy discovery
  /discover-policy/{serviceName}:
    get:
      description: Generate policies from a service’s recorded requests
      operationId: getServiecDiscoverPolicies
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Filter by principal type
          in: query
          name: principalType
          type: string
        - description: Filter by principal name
          in: query
          name: principalName
          type: string
        - description: Filter by identity domain
          in: query
          name: principalIDD
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/DiscoverPolicies'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Generate policies from a service’s recorded requests
      tags:
        - policy discovery
  /discover-request:
    delete:
      description: Delete all recorded requests
      operationId: deleteDiscoverRequests
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: discover request is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete all recorded requests
      tags:
        - policy discovery
    get:
      description: List recorded requests and their revision
      operationId: listDiscoverRequests
      parameters:
        - description: Return the most recent request
          in: query
          name: last
          type: boolean
        - description: Return requests after this revision
          format: int64
          in: query
          name: revision
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/DiscoverRequest'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: Discover request is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List recorded requests and their revision
      tags:
        - policy discovery
  /discover-request/{serviceName}:
    delete:
      description: Delete recorded requests for a service
      operationId: deleteServiceDiscoverRequest
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: discover request is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete recorded requests for a service
      tags:
        - policy discovery
    get:
      description: List recorded requests for a service
      operationId: listServiceDiscoverRequests
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Return the most recent request
          in: query
          name: last
          type: boolean
        - description: Return requests after this revision
          format: int64
          in: query
          name: revision
          type: integer
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/DiscoverRequest'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: discover request is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List recorded requests for a service
      tags:
        - policy discovery
  /function:
    delete:
      description: Delete all custom functions
      operationId: deleteFunctions
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete all custom functions
      tags:
        - function
    get:
      description: List custom functions
      operationId: listFunctions
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            items:
              $ref: '#/definitions/Function'
            type: array
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List custom functions
      tags:
        - function
    post:
      consumes:
        - application/json
      description: Create a custom function
      operationId: createFunction
      parameters:
        - description: Request of creating a function
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Function'
      produces:
        - application/json
      responses:
        "201":
          description: Successful operation
          schema:
            $ref: '#/definitions/Function'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Create a custom function
      tags:
        - function
  /function/{functionName}:
    delete:
      description: Delete a custom function
      operationId: deleteFunction
      parameters:
        - description: Function name
          in: path
          name: functionName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: function is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete a custom function
      tags:
        - function
    get:
      description: Get a custom function
      operationId: getFunction
      parameters:
        - description: Function name
          in: path
          name: functionName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/Function'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: function is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get a custom function
      tags:
        - function
  /policy-counts:
    get:
      description: Count authorization and role policies by service
      operationId: listPolicyCounts
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/PolicyCounts'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Count authorization and role policies by service
      tags:
        - service
  /service:
    delete:
      description: Delete all services
      operationId: deleteServices
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete all services
      tags:
        - service
    get:
      description: List services
      operationId: listServices
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            items:
              $ref: '#/definitions/Service'
            type: array
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List services
      tags:
        - service
    post:
      consumes:
        - application/json
      description: Create a service, optionally with policies
      operationId: createService
      parameters:
        - description: Request of creating a service
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Service'
      produces:
        - application/json
      responses:
        "201":
          description: Successful operation
          schema:
            $ref: '#/definitions/Service'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Create a service, optionally with policies
      tags:
        - service
  /service/{serviceName}:
    delete:
      description: Delete a service and its policies
      operationId: deleteService
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete a service and its policies
      tags:
        - service
    get:
      description: Get a service and its policies
      operationId: getService
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/Service'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get a service and its policies
      tags:
        - service
  /service/{serviceName}/policy:
    delete:
      description: Delete all authorization policies in a service
      operationId: deletePolicies
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete all authorization policies in a service
      tags:
        - policy
    get:
      description: List authorization policies
      operationId: listPolicies
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Optional store-supported filter expression
          in: query
          name: filter
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            items:
              $ref: '#/definitions/PolicyResponse'
            type: array
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List authorization policies
      tags:
        - policy
    post:
      consumes:
        - application/json
      description: Create an authorization policy
      operationId: createPolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Request of creating a service
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/Policy'
      produces:
        - application/json
      responses:
        "201":
          description: Successful operation
          schema:
            $ref: '#/definitions/PolicyResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Create an authorization policy
      tags:
        - policy
  /service/{serviceName}/policy/{policyID}:
    delete:
      description: Delete an authorization policy
      operationId: deletePolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Policy ID
          in: path
          name: policyID
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service or policy is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete an authorization policy
      tags:
        - policy
    get:
      description: Get an authorization policy
      operationId: getPolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Policy ID
          in: path
          name: policyID
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/PolicyResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service or policy is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get an authorization policy
      tags:
        - policy
  /service/{serviceName}/role-policy:
    delete:
      description: Delete all role policies in a service
      operationId: deleteRolePolicies
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete all role policies in a service
      tags:
        - role-policy
    get:
      description: List role policies
      operationId: listRolePolicies
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Optional store-supported filter expression
          in: query
          name: filter
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            items:
              $ref: '#/definitions/RolePolicyResponse'
            type: array
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: List role policies
      tags:
        - role-policy
    post:
      consumes:
        - application/json
      description: Create a role policy
      operationId: createRolePolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Request of creating a service
          in: body
          name: body
          required: true
          schema:
            $ref: '#/definitions/RolePolicy'
      produces:
        - application/json
      responses:
        "201":
          description: Successful operation
          schema:
            $ref: '#/definitions/RolePolicyResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service is not found
        "415":
          description: Content-Type must be application/json
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Create a role policy
      tags:
        - role-policy
  /service/{serviceName}/role-policy/{rolePolicyID}:
    delete:
      description: Delete a role policy
      operationId: deleteRolePolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Role Policy ID
          in: path
          name: rolePolicyID
          required: true
          type: string
      produces:
        - application/json
      responses:
        "204":
          description: Successful operation
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service or role policy is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Delete a role policy
      tags:
        - role-policy
    get:
      description: Get a role policy
      operationId: getRolePolicy
      parameters:
        - description: Service name
          in: path
          name: serviceName
          required: true
          type: string
        - description: Role Policy ID
          in: path
          name: rolePolicyID
          required: true
          type: string
      produces:
        - application/json
      responses:
        "200":
          description: Successful operation
          schema:
            $ref: '#/definitions/RolePolicyResponse'
        "400":
          description: Invalid JSON or request data
          schema:
            $ref: '#/definitions/Error'
        "404":
          description: service or role policy is not found
        "500":
          description: Evaluation, assertion or storage failure
          schema:
            $ref: '#/definitions/Error'
      summary: Get a role policy
      tags:
        - role-policy
schemes:
  - https
  - http
swagger: "2.0"
