kind: Service
apiVersion: v1
metadata:
  name: speedle
spec:
  selector:
    app: speedle
  ports:
  - protocol: TCP
    port: 6733
    targetPort: 6733
    name: pms
  - protocol: TCP
    port: 6734
    targetPort: 6734
    name: ads

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedle
  labels:
    app: speedle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedle
      name: ads
  template:
    metadata:
      labels:
        app: speedle
        name: ads
    spec:
      serviceAccountName: speedle
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ads
        image: speedle-ads:v0.1
        ports:
        - containerPort: 6734
        volumeMounts:
        - mountPath: /var/lib/speedle
          name: policy-store
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 6734
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6734
          initialDelaySeconds: 5
          periodSeconds: 5
      - name: pms
        image: speedle-pms:v0.1
        ports:
        - containerPort: 6733
        volumeMounts:
        - mountPath: /var/lib/speedle
          name: policy-store
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 6733
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6733
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: policy-store
        hostPath:
          path: /home/opc/policystore

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: speedle
