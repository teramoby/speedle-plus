# Single-member demonstration with a PVC. Production should supply an etcd
# cluster with the availability, backup and access controls it requires.
# Create etcd-server-tls before applying; all remote clients require mTLS.
apiVersion: v1
kind: Service
metadata:
  name: speedle-etcd
spec:
  clusterIP: None
  selector:
    app: speedle-example-etcd
  ports:
    - name: client
      port: 2379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: speedle-etcd
spec:
  serviceName: speedle-etcd
  replicas: 1
  selector:
    matchLabels:
      app: speedle-example-etcd
  template:
    metadata:
      labels:
        app: speedle-example-etcd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.35
          command: ["/usr/local/bin/etcd"]
          args:
            - --name=example
            - --data-dir=/var/lib/etcd
            - --listen-client-urls=https://0.0.0.0:2379
            - --advertise-client-urls=https://speedle-etcd:2379
            - --cert-file=/etc/etcdtls/server.crt
            - --key-file=/etc/etcdtls/server.key
            - --trusted-ca-file=/etc/etcdtls/ca.crt
            - --client-cert-auth=true
            - --enable-grpc-gateway=false
            - --listen-peer-urls=http://127.0.0.1:2380
            - --initial-advertise-peer-urls=http://127.0.0.1:2380
            - --initial-cluster=example=http://127.0.0.1:2380
          ports:
            - name: client
              containerPort: 2379
          volumeMounts:
            - name: data
              mountPath: /var/lib/etcd
            - name: server-tls
              mountPath: /etc/etcdtls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: client
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: client
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/usr/local/bin/etcdctl", "--endpoints=https://127.0.0.1:2379", "--cacert=/etc/etcdtls/ca.crt", "--cert=/etc/etcdtls/client.crt", "--key=/etc/etcdtls/client.key", "endpoint", "health"]
            timeoutSeconds: 3
            periodSeconds: 5
      volumes:
        - name: server-tls
          secret:
            secretName: etcd-server-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
