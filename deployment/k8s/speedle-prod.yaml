kind: Namespace
apiVersion: v1
metadata:
  name: speedle

---

kind: Service
apiVersion: v1
metadata:
  name: speedle-pms
  namespace: speedle
spec:
  selector:
    app: speedle
    name: pms
  type: NodePort
  ports:
  - protocol: TCP
    port: 6733
    targetPort: 6733
    name: pms

---

kind: Service
apiVersion: v1
metadata:
  name: speedle-ads
  namespace: speedle
spec:
  selector:
    app: speedle
    name: ads
  ports:
  - protocol: TCP
    port: 6734
    targetPort: 6734
    name: ads

---

kind: Service
apiVersion: v1
metadata:
  name: speedle-etcd
  namespace: speedle
spec:
  selector:
    app: speedle
    name: etcd
  ports:
  - protocol: TCP
    port: 2379
    targetPort: 2379
    name: etcd

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedle-etcd
  namespace: speedle
  labels:
    app: speedle
    name: etcd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedle
      name: etcd
  template:
    metadata:
      labels:
        app: speedle
        name: etcd
    spec:
      serviceAccountName: speedle
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: etcd
        image: quay.io/coreos/etcd:v3.5.18
        command: ["/usr/local/bin/etcd"]
        args: ["--listen-client-urls", "http://0.0.0.0:2379", "--advertise-client-urls", "http://0.0.0.0:2379"]
        ports:
        - containerPort: 2379
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: false
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 2379
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 2379
          initialDelaySeconds: 5
          periodSeconds: 5

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedle-pms
  namespace: speedle
  labels:
    app: speedle
    name: pms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedle
      name: pms
  template:
    metadata:
      labels:
        app: speedle
        name: pms
    spec:
      serviceAccountName: speedle
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: pms
        image: r.authz.fun/speedle-pms:v0.1  # please update image location
        command: ["speedle-pms"]
        args: ["--endpoint", "0.0.0.0:6733", "--store-type", "etcd", "--etcdstore-endpoint", "speedle-etcd:2379"]
        ports:
        - containerPort: 6733
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 6733
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6733
          initialDelaySeconds: 5
          periodSeconds: 5

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedle-ads
  namespace: speedle
  labels:
    app: speedle
    name: ads
spec:
  replicas: 3
  selector:
    matchLabels:
      app: speedle
      name: ads
  template:
    metadata:
      labels:
        app: speedle
        name: ads
    spec:
      serviceAccountName: speedle
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: ads
        image: r.authz.fun/speedle-ads:v0.1  # please update image location
        command: ["speedle-ads"]
        args: ["--endpoint", "0.0.0.0:6734", "--store-type", "etcd", "--etcdstore-endpoint", "speedle-etcd:2379"]
        ports:
        - containerPort: 6734
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 6734
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 6734
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: speedle
  namespace: speedle
