---
# Source: speedle/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: speedle-prod-pms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pms
      release: speedle-prod
  template:
    metadata:
      labels:
        app: pms
        release: speedle-prod
    spec:
      serviceAccountName: speedle-prod
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: pms
          image: "speedle-pms:dev"
          imagePullPolicy: IfNotPresent
          env:
            - name: SPDL_STORE_TYPE
              value: etcd
          args:
            - --endpoint=0.0.0.0:6733
            - --grpc-endpoint=0.0.0.0:50001
            - --health-endpoint=127.0.0.1:8081
            - --store-type=etcd
            - --etcdstore-endpoint=https://speedle-etcd:2379
            - --etcdstore-tls-cert=/etc/etcdtls/client.crt
            - --etcdstore-tls-key=/etc/etcdtls/client.key
            - --etcdstore-tls-ca=/etc/etcdtls/ca.crt
            - --insecure=false
            - --cert=/etc/tls/server.crt
            - --key=/etc/tls/server.key
            - --client-cert=/etc/tls/ca.crt
            - --force-client-cert=true
          ports:
            - name: http
              containerPort: 6733
            - name: grpc
              containerPort: 50001
          volumeMounts:
            - name: server-tls
              mountPath: /etc/tls
              readOnly: true
            - name: etcd-client-tls
              mountPath: /etc/etcdtls
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          startupProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8081/livez"]
            timeoutSeconds: 3
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8081/livez"]
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
            timeoutSeconds: 3
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: server-tls
          secret:
            secretName: speedle-server-tls
            defaultMode: 0440
        - name: etcd-client-tls
          secret:
            secretName: etcd-client-tls
            defaultMode: 0440

