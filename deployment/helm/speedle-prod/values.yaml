# Default values for speedle.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  pms: r.authz.fun/speedle-pms:v0.1
  ads: r.authz.fun/speedle-ads:v0.1
  pullPolicy: Always
  pullSecret: "reg-speedle"

service:
  type: ClusterIP
  pmsPort: 6733
  adsPort: 6734

tls:
  certSecret: speedle-server-tls
  certFile: server.crt
  keyFile: server.key
  trustedCAFile: server-ca.crt
  forceClientCert: true

store:
  type: etcd
  etcd:
    endpoint: http://localhost:2379
    # TLS enabled
    # endpoint: https://example-client.default.svc:2379
    # etcdClientCertSecret: etcd-client-tls
    # certFile: etcd-client.crt
    # keyFile: etcd-client.key
    # trustedCAFile: etcd-client-ca.crt

# The policy management console (speedle-console). Off by default.
console:
  enabled: false
  replicaCount: 1
  image: r.authz.fun/speedle-console:v0.1
  port: 6735
  # Token asserter webhook that signs users in, such as
  # https://asserter:8443/assert. Required when the console is enabled.
  asserterEndpoint: ""
  # Speedle service whose policies grant read and write on the console resource.
  authzService: speedle-console
  # Comma-separated principals (type:name) with full access before console
  # policies exist. Remove them once the policies are written.
  bootstrapAdmins: ""
  # Secret with a key named session.key (32 bytes or more) that signs session
  # cookies. Required with more than one replica.
  sessionKeySecret: ""
  # The console's own HTTPS certificate. Leave certSecret empty to serve
  # HTTP behind a proxy that terminates TLS; secureCookie then keeps the
  # session cookie HTTPS-only.
  tls:
    certSecret: ""
    certFile: tls.crt
    keyFile: tls.key
  secureCookie: true
  # How the console reaches PMS and ADS when tls above is set: the CA that
  # signed their certificates and, with forceClientCert, the client
  # certificate they require.
  upstreamTLS:
    certSecret: ""
    caFile: ca.crt
    certFile: tls.crt
    keyFile: tls.key
