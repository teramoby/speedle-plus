replicaCount: 1
image:
  pms: speedle-pms:dev
  ads: speedle-ads:dev
  pullPolicy: IfNotPresent
  pullSecret: ""
service:
  type: ClusterIP
  pmsPort: 6733
  adsPort: 6734
resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
serviceAccount:
  create: true
  name: ""
tls:
  enabled: true
  certSecret: speedle-server-tls
  certFile: server.crt
  keyFile: server.key
  trustedCAFile: ca.crt
  forceClientCert: true
store:
  type: etcd
  etcd:
    # Supply a protected backend explicitly; see values-example.yaml.
    endpoint: ""
    # Legacy/externally protected backends require an intentional opt-in.
    allowInsecure: false
    etcdClientCertSecret: ""
    certFile: client.crt
    keyFile: client.key
    trustedCAFile: ca.crt
