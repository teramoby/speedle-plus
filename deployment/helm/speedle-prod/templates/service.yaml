{{- range $service := list (dict "name" "pms" "port" $.Values.service.pmsPort "grpc" 50001) (dict "name" "ads" "port" $.Values.service.adsPort "grpc" 50002) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "speedle.fullname" $ }}-{{ $service.name }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    app: {{ $service.name }}
    release: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
    - name: grpc
      port: {{ $service.grpc }}
      targetPort: grpc
{{- end }}
