{{- if ne .Values.store.type "etcd" }}
{{- fail "The multi-Pod chart requires store.type=etcd; use the development chart for a shared file store." }}
{{- end }}
{{- if and .Values.store.etcd.etcdClientCertSecret (ne (empty .Values.store.etcd.certFile) (empty .Values.store.etcd.keyFile)) }}
{{- fail "The etcd client certificate and key must both be configured or both be empty." }}
{{- end }}
{{- if and .Values.tls.enabled (or (empty .Values.tls.certSecret) (empty .Values.tls.certFile) (empty .Values.tls.keyFile)) }}
{{- fail "TLS requires tls.certSecret, tls.certFile and tls.keyFile." }}
{{- end }}
{{- if and .Values.tls.enabled .Values.tls.forceClientCert (empty .Values.tls.trustedCAFile) }}
{{- fail "mTLS requires tls.trustedCAFile." }}
{{- end }}
{{- range $service := list (dict "name" "pms" "port" 6733 "grpc" 50001 "health" 8081) (dict "name" "ads" "port" 6734 "grpc" 50002 "health" 8082) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "speedle.fullname" $ }}-{{ $service.name }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ $service.name }}
      release: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app: {{ $service.name }}
        release: {{ $.Release.Name }}
    spec:
      serviceAccountName: {{ include "speedle.serviceAccountName" $ }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if $.Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ $.Values.image.pullSecret | quote }}
      {{- end }}
      containers:
        - name: {{ $service.name }}
          image: {{ index $.Values.image $service.name | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: SPDL_STORE_TYPE
              value: etcd
          args:
            - --endpoint=0.0.0.0:{{ $service.port }}
            - --grpc-endpoint=0.0.0.0:{{ $service.grpc }}
            - --health-endpoint=127.0.0.1:{{ $service.health }}
            - --store-type=etcd
            - --etcdstore-endpoint={{ required "store.etcd.endpoint is required" $.Values.store.etcd.endpoint }}
            {{- if $.Values.store.etcd.etcdClientCertSecret }}
            {{- if $.Values.store.etcd.certFile }}
            - --etcdstore-tls-cert=/etc/etcdtls/{{ $.Values.store.etcd.certFile }}
            - --etcdstore-tls-key=/etc/etcdtls/{{ $.Values.store.etcd.keyFile }}
            {{- end }}
            {{- if $.Values.store.etcd.trustedCAFile }}
            - --etcdstore-tls-ca=/etc/etcdtls/{{ $.Values.store.etcd.trustedCAFile }}
            {{- end }}
            {{- end }}
            {{- if $.Values.tls.enabled }}
            - --insecure=false
            - --cert=/etc/tls/{{ $.Values.tls.certFile }}
            - --key=/etc/tls/{{ $.Values.tls.keyFile }}
            {{- if $.Values.tls.trustedCAFile }}
            - --client-cert=/etc/tls/{{ $.Values.tls.trustedCAFile }}
            {{- end }}
            - --force-client-cert={{ $.Values.tls.forceClientCert }}
            {{- else }}
            - --insecure=true
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $service.port }}
            - name: grpc
              containerPort: {{ $service.grpc }}
          {{- if or $.Values.tls.enabled $.Values.store.etcd.etcdClientCertSecret }}
          volumeMounts:
            {{- if $.Values.tls.enabled }}
            - name: server-tls
              mountPath: /etc/tls
              readOnly: true
            {{- end }}
            {{- if $.Values.store.etcd.etcdClientCertSecret }}
            - name: etcd-client-tls
              mountPath: /etc/etcdtls
              readOnly: true
            {{- end }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
          startupProbe:
            {{- include "speedle.execProbe" (dict "port" $service.health "path" "livez") | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            {{- include "speedle.execProbe" (dict "port" $service.health "path" "livez") | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            {{- include "speedle.execProbe" (dict "port" $service.health "path" "readyz") | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 3
      {{- if or $.Values.tls.enabled $.Values.store.etcd.etcdClientCertSecret }}
      volumes:
        {{- if $.Values.tls.enabled }}
        - name: server-tls
          secret:
            secretName: {{ $.Values.tls.certSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if $.Values.store.etcd.etcdClientCertSecret }}
        - name: etcd-client-tls
          secret:
            secretName: {{ $.Values.store.etcd.etcdClientCertSecret }}
            defaultMode: 0440
        {{- end }}
      {{- end }}
{{- end }}
