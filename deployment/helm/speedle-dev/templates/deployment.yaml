apiVersion: apps/v1beta2
kind: Deployment
metadata:
  name: {{ template "speedle.fullname" . }}
  labels:
    app: speedle
    chart: {{ template "speedle.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: speedle
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: speedle
        release: {{ .Release.Name }}
    spec:
      imagePullSecrets:
        - name: "{{ .Values.image.pullSecret }}"
      containers:
        - name: pms
          image: "{{ .Values.image.pms }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /var/lib/speedle
              name: policy-store
          ports:
            - name: pms
              containerPort: 6733
              protocol: TCP
        - name: ads
          image: "{{ .Values.image.ads }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          volumeMounts:
            - mountPath: /var/lib/speedle
              name: policy-store
          ports:
            - name: ads
              containerPort: 6734
              protocol: TCP
        {{- if .Values.console.enabled }}
        - name: console
          image: "{{ .Values.console.image }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --pms-url
            - http://127.0.0.1:6733
            - --ads-url
            - http://127.0.0.1:6734
            - --asserter-endpoint
            - {{ required "console.asserterEndpoint is required when the console is enabled" .Values.console.asserterEndpoint | quote }}
            - --authz-service
            - {{ .Values.console.authzService | quote }}
            {{- with .Values.console.bootstrapAdmins }}
            - --bootstrap-admins
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: console
              containerPort: 6735
              protocol: TCP
        {{- end }}
      volumes:
      - name: policy-store
        hostPath:
          path: /home/opc/policystore
