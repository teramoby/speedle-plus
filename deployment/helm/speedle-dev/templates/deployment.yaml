{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "The file-store development chart requires replicaCount=1; use the etcd chart for multiple replicas." }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "speedle.fullname" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: speedle
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: speedle
        release: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "speedle.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      {{- if .Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret | quote }}
      {{- end }}
      containers:
        - name: pms
          image: {{ .Values.image.pms | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--insecure=true", "--endpoint=0.0.0.0:6733", "--grpc-endpoint=0.0.0.0:50001", "--health-endpoint=127.0.0.1:8081"]
          ports:
            - name: pms
              containerPort: 6733
            - name: pms-grpc
              containerPort: 50001
          volumeMounts:
            - name: policy-store
              mountPath: /var/lib/speedle
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- include "speedle.execProbe" (dict "port" 8081 "path" "livez") | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            {{- include "speedle.execProbe" (dict "port" 8081 "path" "livez") | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            {{- include "speedle.execProbe" (dict "port" 8081 "path" "readyz") | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 3
        - name: ads
          image: {{ .Values.image.ads | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--insecure=true", "--endpoint=0.0.0.0:6734", "--grpc-endpoint=0.0.0.0:50002", "--health-endpoint=127.0.0.1:8082"]
          ports:
            - name: ads
              containerPort: 6734
            - name: ads-grpc
              containerPort: 50002
          volumeMounts:
            - name: policy-store
              mountPath: /var/lib/speedle
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          startupProbe:
            {{- include "speedle.execProbe" (dict "port" 8082 "path" "livez") | nindent 12 }}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            {{- include "speedle.execProbe" (dict "port" 8082 "path" "livez") | nindent 12 }}
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            {{- include "speedle.execProbe" (dict "port" 8082 "path" "readyz") | nindent 12 }}
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: policy-store
          {{- if .Values.storage.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.storage.existingClaim | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
