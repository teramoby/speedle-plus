apiVersion: v1
kind: Service
metadata:
  name: {{ include "speedle.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: speedle
    release: {{ .Release.Name }}
  ports:
    - name: pms
      port: {{ .Values.service.pmsPort }}
      targetPort: pms
    - name: ads
      port: {{ .Values.service.adsPort }}
      targetPort: ads
    - name: pms-grpc
      port: 50001
      targetPort: pms-grpc
    - name: ads-grpc
      port: 50002
      targetPort: ads-grpc
