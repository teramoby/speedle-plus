replicaCount: 1
image:
  pms: speedle-pms:dev
  ads: speedle-ads:dev
  pullPolicy: IfNotPresent
  pullSecret: ""
service:
  type: ClusterIP
  pmsPort: 6733
  adsPort: 6734
resources:
  requests:
    memory: 64Mi
    cpu: 50m
  limits:
    memory: 256Mi
    cpu: 200m
serviceAccount:
  create: true
  name: ""
# Empty means ephemeral emptyDir; use an existing PVC to retain demo policies.
storage:
  existingClaim: ""
