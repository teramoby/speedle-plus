name: MongoDB nightly validation

# The scheduled nightly runs this regression with every backend; this
# workflow runs it on demand, on any speedle-runner including macOS.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner label (speedle-runner lets any Speedle runner take it)
        type: choice
        options: [speedle-runner, speedle-macos, speedle-linux]
        default: speedle-runner
      inventory_only:
        description: Report the runner's tools without running the regression
        type: boolean
        default: false

permissions:
  contents: read

# Shares the nightly's group: both use the host-wide etcd ports the Go tests
# need, and any speedle-runner may run either.
concurrency:
  group: nightly-tests
  cancel-in-progress: false

jobs:
  mongodb:
    name: MongoDB
    runs-on: ${{ github.event.inputs.runner || 'speedle-runner' }}
    timeout-minutes: 60
    steps:
      - name: Verify runner identity
        run: |
          set -euo pipefail
          # The platforms validate-mongodb.sh downloads mongod for.
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            macOS/ARM64 | Linux/X64) ;;
            *) echo "Unsupported MongoDB runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "MongoDB runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"

      # What the CI scripts expect from a runner; reports only, never fails.
      - name: Report runner tools
        run: |
          uname -a
          id
          for tool in bash git python3 node go docker sg flock unshare ip hugo jq curl shasum clang gcc lsof; do
            if path=$(command -v "${tool}"); then printf '%-8s %s\n' "${tool}" "${path}"; else printf '%-8s MISSING\n' "${tool}"; fi
          done
          bash --version | head -1; python3 --version; node --version 2>/dev/null || true
          docker info --format 'docker server {{.ServerVersion}}' 2>&1 | head -1 || true
          hugo version 2>/dev/null || true
          getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu
          df -h "${RUNNER_TEMP:-/tmp}" | tail -1
          for port in 2379 2380 6733 6734 27017 3306; do
            python3 -c "import socket,sys; s=socket.socket(); s.bind(('127.0.0.1', int(sys.argv[1]))); print('port', sys.argv[1], 'free')" "${port}" 2>/dev/null || echo "port ${port} IN USE"
          done

      - name: Checkout validation revision
        if: ${{ github.event.inputs.inventory_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        if: ${{ github.event.inputs.inventory_only != 'true' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
          cache: false

      - name: Full test suite against MongoDB
        if: ${{ github.event.inputs.inventory_only != 'true' }}
        run: |
          set -euo pipefail
          mkdir -p mongodb-results
          bash scripts/ci/validate-mongodb.sh 2>&1 | tee mongodb-results/mongodb.log

      - name: Upload MongoDB results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mongodb-results
          path: mongodb-results/
          if-no-files-found: warn
