name: MongoDB nightly validation

# The scheduled nightly runs this regression with every backend; this
# workflow runs it on demand, on any speedle-runner including macOS.
on:
  workflow_dispatch:
    inputs:
      nightly_trial:
        description: Run the full nightly suite only on Fiona, without changing scheduled nightly
        type: boolean
        default: false
      ci_trial:
        description: Run one CI task only on Fiona, as go-ci-worker or ReviewBot would, without changing CI routing
        type: choice
        options: [none, lint, test, regression, weekly, reviewbot]
        default: none
      runner:
        description: Runner label (speedle-runner lets any Speedle runner take it)
        type: choice
        options: [speedle-runner, speedle-macos, speedle-linux]
        default: speedle-runner
      inventory_only:
        description: Report the runner's tools without running the regression
        type: boolean
        default: false
      install_flock:
        description: On macOS, brew install flock when it is missing (the CI host lock needs it)
        type: boolean
        default: false

permissions:
  contents: read

# A regression shares the nightly's group: both use the host-wide etcd ports
# the Go tests need, and any speedle-runner may run either. An inventory-only
# run uses no test ports, so it never waits behind a nightly.
concurrency:
  group: ${{ github.event.inputs.inventory_only == 'true' && format('runner-inventory-{0}', github.run_id) || 'nightly-tests' }}
  cancel-in-progress: false

jobs:
  mongodb:
    name: MongoDB
    runs-on: ${{ (github.event.inputs.nightly_trial == 'true' || (github.event.inputs.ci_trial != '' && github.event.inputs.ci_trial != 'none')) && 'fiona-speedle' || github.event.inputs.runner || 'speedle-runner' }}
    timeout-minutes: ${{ (github.event.inputs.nightly_trial == 'true' || github.event.inputs.ci_trial == 'weekly') && 150 || 60 }}
    steps:
      - name: Verify runner identity
        run: |
          set -euo pipefail
          # The platforms validate-mongodb.sh downloads mongod for.
          case "${RUNNER_OS}/${RUNNER_ARCH}" in
            macOS/ARM64 | Linux/X64) ;;
            *) echo "Unsupported MongoDB runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
          echo "MongoDB runner: ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})"

      - name: Install flock
        if: ${{ github.event.inputs.install_flock == 'true' && runner.os == 'macOS' }}
        run: |
          set -euo pipefail
          command -v flock || brew install flock
          flock --version

      # What the CI scripts expect from a runner; reports only, never fails.
      - name: Report runner tools
        run: |
          uname -a
          id
          for tool in bash git python3 node go docker sg flock unshare ip hugo jq curl shasum clang gcc lsof; do
            if path=$(command -v "${tool}"); then printf '%-8s %s\n' "${tool}" "${path}"; else printf '%-8s MISSING\n' "${tool}"; fi
          done
          bash --version | head -1; python3 --version; node --version 2>/dev/null || true
          docker version 2>&1 | grep -iE '^(client|server)|version:|cannot connect|permission denied|error' | head -8 || true
          hugo version 2>/dev/null || true
          getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu
          df -h "${RUNNER_TEMP:-/tmp}" | tail -1
          for port in 2379 2380 6733 6734 27017 3306; do
            python3 -c "import socket,sys; s=socket.socket(); s.bind(('127.0.0.1', int(sys.argv[1]))); print('port', sys.argv[1], 'free')" "${port}" 2>/dev/null || echo "port ${port} IN USE"
          done

      - name: Checkout validation revision
        if: ${{ github.event.inputs.inventory_only != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        if: ${{ github.event.inputs.inventory_only != 'true' }}
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26'
          cache: false

      - name: Setup Node for nightly trial
        if: ${{ (github.event.inputs.nightly_trial == 'true' || github.event.inputs.ci_trial == 'reviewbot') && github.event.inputs.inventory_only != 'true' }}
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Full nightly trial on Fiona
        if: ${{ github.event.inputs.nightly_trial == 'true' && github.event.inputs.inventory_only != 'true' }}
        env:
          RESULTS_DIR: ${{ runner.temp }}/fiona-nightly-results-${{ github.run_id }}-${{ github.run_attempt }}
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}" = fiona-speedle/macOS/ARM64
          export GOPATH="$(go env GOPATH)"
          exec 9>/tmp/speedle-plus-test-services.lock
          flock -w 7200 9
          python3 - <<'PYTHON'
          import errno
          import socket
          for port in (2379, 2380, 27017, 6733, 6734):
              for family, address in ((socket.AF_INET, '0.0.0.0'), (socket.AF_INET, '127.0.0.1'), (socket.AF_INET6, '::'), (socket.AF_INET6, '::1')):
                  try:
                      with socket.socket(family, socket.SOCK_STREAM) as probe:
                          probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                          if family == socket.AF_INET6:
                              probe.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                          probe.bind((address, port))
                  except OSError as error:
                      if family == socket.AF_INET6 and error.errno in (errno.EAFNOSUPPORT, errno.EADDRNOTAVAIL):
                          continue
                      raise SystemExit(f'Test service port {port} is in use; refusing to touch an existing service.') from error
          PYTHON
          bash scripts/ci/run-go-tests.sh nightly

      # The same commands go-ci-worker.yml runs for lint, test (gate) and
      # regression, and ReviewBot's fixture job runs, so Fiona can be checked
      # before CI routes these tasks to it.
      - name: CI trial on Fiona
        if: ${{ github.event.inputs.ci_trial != '' && github.event.inputs.ci_trial != 'none' && github.event.inputs.nightly_trial != 'true' && github.event.inputs.inventory_only != 'true' }}
        env:
          CI_TRIAL: ${{ github.event.inputs.ci_trial }}
          RESULTS_DIR: ${{ runner.temp }}/fiona-ci-trial-${{ github.run_id }}-${{ github.run_attempt }}
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}" = fiona-speedle/macOS/ARM64
          export GOPATH="$(go env GOPATH)"
          case "${CI_TRIAL}" in
            lint)
              go vet -composites=false ./pkg/... ./cmd/... ./api/...
              go mod tidy -diff
              ;;
            test|regression|weekly)
              exec 9>/tmp/speedle-plus-test-services.lock
              flock -w 7200 9
              case "${CI_TRIAL}" in
                test) bash scripts/ci/run-go-tests.sh gate ;;
                regression) bash scripts/ci/run-go-tests.sh regression ;;
                weekly) bash scripts/ci/run-go-tests.sh weekly ;;
              esac
              ;;
            reviewbot)
              for tool in git curl jq python3; do command -v "${tool}"; done
              code=$(curl --silent --show-error --connect-timeout 15 --max-time 30 --output /dev/null --write-out '%{http_code}' https://ark.cn-beijing.volces.com/api/plan/v3/responses)
              echo "Ark HTTPS reachable (HTTP ${code})."
              python3 scripts/tests/test_reviewbot_diff.py -v
              python3 scripts/tests/test_reviewbot_response.py -v
              node --test scripts/tests/test_reviewbot_commands.cjs scripts/tests/test_reviewbot_automerge.cjs scripts/tests/test_runner_routing.cjs scripts/tests/test_go_ci_worker.cjs
              ;;
            *) echo "Unknown CI trial ${CI_TRIAL}." >&2; exit 1 ;;
          esac

      - name: Upload Fiona CI trial results
        if: ${{ always() && (github.event.inputs.ci_trial == 'regression' || github.event.inputs.ci_trial == 'test' || github.event.inputs.ci_trial == 'weekly') }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiona-ci-trial-results
          path: |
            ${{ runner.temp }}/fiona-ci-trial-${{ github.run_id }}-${{ github.run_attempt }}/
            coverage.out
          if-no-files-found: warn

      - name: Clean owned trial MySQL containers
        if: ${{ always() && github.event.inputs.nightly_trial == 'true' && github.event.inputs.inventory_only != 'true' }}
        run: python3 scripts/ci/run-mysql-tests.py --cleanup

      - name: Upload Fiona nightly trial results
        if: ${{ always() && github.event.inputs.nightly_trial == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fiona-nightly-results
          path: ${{ runner.temp }}/fiona-nightly-results-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: warn

      - name: Full test suite against MongoDB
        if: ${{ github.event.inputs.inventory_only != 'true' && github.event.inputs.nightly_trial != 'true' && (github.event.inputs.ci_trial == '' || github.event.inputs.ci_trial == 'none') }}
        run: |
          set -euo pipefail
          mkdir -p mongodb-results
          bash scripts/ci/validate-mongodb.sh 2>&1 | tee mongodb-results/mongodb.log

      - name: Upload MongoDB results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mongodb-results
          path: mongodb-results/
          if-no-files-found: warn
