name: Speedle Plus CI

on:
  # Pull requests are checked by their pull_request run; pushes are checked on
  # master only, so a pull request branch is not tested twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its older, still-running checks.
# master pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run only what a change can affect:
  #   go      - Go lint/build: anything outside docs/, website/ and root
  #             Markdown, including CI configuration
  #   website - Playground engine and site tooling (build job runs verify.sh,
  #             including the generated-site checks)
  #   docs    - published GitHub Pages content only: the light site job
  # An unknown base (workflow_dispatch, new branch) runs everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          go=true website=true docs=true
          if [[ -n "${base}" && "${base}" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${base}" "${GITHUB_SHA}")
            go=false website=false docs=false
            while IFS= read -r file; do
              case "${file}" in
                '') ;;
                docs/*) docs=true ;;
                website/*) website=true ;;
                */*) go=true ;;
                *.md) ;;
                *) go=true ;;
              esac
            done <<< "${changed}"
          fi
          {
            echo "go=${go}"
            echo "website=${website}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"
          echo "Go: ${go}; website tooling: ${website}; docs: ${docs}"

  site:
    name: site
    needs: changes
    # The build job's verify.sh already includes these checks.
    if: needs.changes.outputs.docs == 'true' && needs.changes.outputs.go != 'true' && needs.changes.outputs.website != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # site.test.cjs compares the homepage with a historical commit.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      # The Playground release checks without rebuilding its Go engine.
      - name: Verify site
        run: |
          set -euo pipefail
          node website/playground-engine/tests/form-model.test.cjs
          node website/playground-engine/tests/form-dom.test.cjs
          PLAYGROUND_LOCALE=zh node website/playground-engine/tests/form-dom.test.cjs
          node website/playground-engine/tests/site.test.cjs
          python3 website/tests/test_language_routes.py
          python3 website/localize-links.py docs --check
          website/playground-engine/verify-hugo.sh

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: lint

  # Global merge gate for every PR and master push, regardless of changed paths:
  # Go tests, coverage, and both executable documentation walkthroughs.
  test:
    name: test
    needs: changes
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.website == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: build

  # Owned, disposable database; never use a resident self-hosted MySQL service.
  mysql:
    name: mysql
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: speedle_test
        ports:
          - 3306/tcp
        options: >-
          --health-cmd "mysqladmin ping --host=127.0.0.1 --user=root --password=ci-test-only --silent"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'

      - name: Test MySQL contract, transactions and ADS propagation
        env:
          SPEEDLE_MYSQL_TEST_DSN: root:ci-test-only@tcp(127.0.0.1:${{ job.services.mysql.ports[3306] }})/speedle_test
          SPEEDLE_REQUIRE_MYSQL: '1'
        run: |
          set -euo pipefail
          mkdir -p mysql-results
          go test -race -json -count=1 -timeout 300s -coverprofile=mysql-results/coverage.out ./pkg/store/mysql > mysql-results/tests.json
          python3 scripts/ci/coverage.py mysql-results/coverage.out --min-file scripts/ci/coverage-min.txt ./pkg/store/mysql

      - name: Execute bilingual MySQL setup guides
        run: python3 website/tests/check_mysql.py > mysql-results/docs.log 2>&1

      - name: Execute bilingual etcd setup guides
        run: python3 website/tests/check_etcd.py > mysql-results/etcd-docs.log 2>&1

      - name: Upload MySQL results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mysql-results
          path: mysql-results/
          if-no-files-found: error
