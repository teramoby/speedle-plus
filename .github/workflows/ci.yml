name: Speedle CI

on:
  # Pull requests are checked by their pull_request run; pushes are checked on
  # master only, so a pull request branch is not tested twice.
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Relevant label additions supersede the PR run, just like a new push.
# Label removals do not trigger this workflow. Keep their defensive ignored
# group too: neither removals nor unrelated additions may replace green checks.
# master pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ (github.event.action == 'unlabeled' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'merge-head')) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run only what a change can affect:
  #   go      - Go lint/build: anything outside docs/, website/ and root
  #             Markdown, including CI configuration
  #   website - Playground engine and site tooling
  #   docs    - published GitHub Pages content
  # The build job runs verify.sh, including the generated-site checks, for
  # any of them. An unknown base (workflow_dispatch, new branch) runs
  # everything. Full checks use the protected default-branch worker; MySQL,
  # MongoDB and the Docker storage guides keep their existing nightly schedule.
  changes:
    name: changes
    if: >-
      github.event.action != 'unlabeled'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'full-ci' || github.event.label.name == 'merge-head')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'merge-head') }}
      go: ${{ steps.scope.outputs.go }}
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          go=true website=true docs=true ci=true
          if [[ -n "${base}" && "${base}" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${base}" "${GITHUB_SHA}")
            go=false website=false docs=false ci=false
            while IFS= read -r file; do
              case "${file}" in
                '') ;;
                docs/*) docs=true ;;
                website/*) website=true ;;
                .github/workflows/*|scripts/*) go=true ci=true ;;
                */*) go=true ;;
                *.md) ;;
                *) go=true ;;
              esac
            done <<< "${changed}"
          fi
          {
            echo "go=${go}"
            echo "website=${website}"
            echo "docs=${docs}"
            echo "ci=${ci}"
          } >> "${GITHUB_OUTPUT}"
          echo "Go: ${go}; website tooling: ${website}; docs: ${docs}"

      - name: Setup Node for workflow routing tests
        if: steps.scope.outputs.ci == 'true'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Test workflow routing
        if: steps.scope.outputs.ci == 'true'
        run: node --test scripts/tests/test_ci_scope.cjs scripts/tests/test_go_ci_worker.cjs

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.go == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: lint

  # Full merge gate, regardless of changed paths: integration tests, the
  # existing coverage threshold and both executable documentation walkthroughs.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: test

  build:
    name: build
    needs: changes
    if: (needs.changes.outputs.full == 'true' && needs.changes.outputs.go == 'true') || needs.changes.outputs.website == 'true' || needs.changes.outputs.docs == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: build

  quick:
    name: quick
    needs: changes
    if: needs.changes.outputs.full != 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: quick

  # CI reports the selected route. Full CI before merge is enforced by the
  # documented maintainer label procedure; no branch protection is configured.
  summary:
    # GitHub publishes skipped jobs too. Never let an ignored label event
    # publish a successful/skipped check under the stable gate's name.
    name: ${{ (github.event.action == 'unlabeled' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'merge-head')) && format('Ignored CI event {0}', github.run_id) || 'CI' }}
    needs: [changes, quick, lint, test, build]
    if: always() && needs.changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the selected CI path
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          full = jobs['changes']['outputs']['full'] == 'true'
          required = ['test'] if full else ['quick']
          outputs = jobs['changes']['outputs']
          if full and outputs['go'] == 'true':
              required.append('lint')
          if (full and outputs['go'] == 'true') or any(outputs[key] == 'true' for key in ('website', 'docs')):
              required.append('build')
          for name in required:
              assert jobs[name]['result'] == 'success', (name, jobs[name])
          assert all(job['result'] in ('success', 'skipped') for job in jobs.values()), jobs
          print('Full CI passed.' if full else 'Quick CI passed; full-ci or merge-head is required before merge.')
          PYTHON
