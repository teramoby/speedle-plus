name: Speedle Plus CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.26'
      - name: go vet
        run: go vet -composites=false ./pkg/... ./cmd/... ./api/...
      - name: go mod tidy check
        run: go mod tidy -diff


  test:
    runs-on: ubuntu-latest
    name: test
    strategy:
      matrix:
        store-type: [file, etcd]
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.26'
      - name: Run tests with coverage
        run: |
          STORE_TYPE=${{ matrix.store-type }} go test -count=1 -timeout 60s -coverprofile=coverage.out $(go list ./pkg/... ./cmd/... ./api/... 2>/dev/null | grep -v samples | grep -v adsgrpc | grep -v pmsgrpc | grep -v pmsrest) || true
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.store-type }}
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.26'
      - name: Build
        run: go build ./cmd/speedle-pms/... ./cmd/speedle-ads/... ./cmd/spctl/...
