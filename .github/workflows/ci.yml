name: Speedle Plus CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: lint
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.24'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - name: go mod tidy check
        run: |
          go mod tidy -diff
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  test:
    runs-on: ubuntu-latest
    name: test
    strategy:
      matrix:
        store-type: [file, etcd]
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.24'
      - name: Run tests with coverage
        run: |
          STORE_TYPE=${{ matrix.store-type }} go test -coverprofile=coverage.out $(go list ./... | grep -v samples | grep -v benchmarks)
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.store-type }}
          path: coverage.out

  build:
    runs-on: ubuntu-latest
    name: build
    steps:
      - uses: actions/checkout@v4
        name: Checkout code
      - uses: actions/setup-go@v5
        name: Setup Go
        with:
          go-version: '1.24'
      - name: Build
        run: make build
