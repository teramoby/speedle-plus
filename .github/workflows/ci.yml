name: Speedle CI

on:
  # Pull requests are checked by their pull_request run; pushes are checked on
  # master only, so a pull request branch is not tested twice.
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# Relevant label additions supersede the PR run, just like a new push.
# Label removals do not trigger this workflow. Keep their defensive ignored
# group too: neither removals nor unrelated additions may replace green checks.
# master pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}${{ (github.event.action == 'unlabeled' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'merge-head')) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run only what a change can affect:
  #   go      - Go lint/build: anything outside docs/, website/ and root
  #             Markdown, including CI configuration
  #   website - Playground engine and site tooling
  #   docs    - published GitHub Pages content
  # The build job runs verify.sh, including the generated-site checks, for
  # any of them. An unknown base (workflow_dispatch, new branch) runs
  # everything. Full checks use the protected default-branch worker; MySQL,
  # MongoDB and the Docker storage guides keep their existing nightly schedule.
  changes:
    name: changes
    if: >-
      github.event.action != 'unlabeled'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'full-ci' || github.event.label.name == 'merge-head')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'merge-head') }}
      go: ${{ steps.scope.outputs.go }}
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          go=true website=true docs=true
          if [[ -n "${base}" && "${base}" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${base}" "${GITHUB_SHA}")
            go=false website=false docs=false
            while IFS= read -r file; do
              case "${file}" in
                '') ;;
                docs/*) docs=true ;;
                website/*) website=true ;;
                */*) go=true ;;
                *.md) ;;
                *) go=true ;;
              esac
            done <<< "${changed}"
          fi
          {
            echo "go=${go}"
            echo "website=${website}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"
          echo "Go: ${go}; website tooling: ${website}; docs: ${docs}"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.full == 'true' && needs.changes.outputs.go == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: lint

  # Full merge gate, regardless of changed paths: integration tests, the
  # existing coverage threshold and both executable documentation walkthroughs.
  test:
    name: test
    needs: changes
    if: needs.changes.outputs.full == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.full == 'true' && (needs.changes.outputs.go == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.docs == 'true')
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: build

  quick:
    name: quick
    needs: changes
    if: needs.changes.outputs.full != 'true'
    # Runner variables are JSON strings or arrays. Forks always stay hosted;
    # labels are scheduling hints and never expand the trusted-event boundary.
    runs-on: >-
      ${{ github.repository == 'teramoby/speedle-plus' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.type == 'User' || github.event.pull_request.user.type == 'Bot') && fromJSON(vars.QUICK_RUNS_ON || '"ubuntu-latest"') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - name: Verify self-hosted runner identity
        if: runner.environment == 'self-hosted'
        run: |
          set -euo pipefail
          case "${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}" in
            charming-speedle/Linux/X64|charming-speedle-2/Linux/X64|donkey-speedle/Linux/X64|fiona-speedle/macOS/ARM64) ;;
            *) echo 'Unexpected runner.' >&2; exit 1 ;;
          esac
          command -v git >/dev/null
          command -v python3 >/dev/null

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Select changed packages
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          def output(*args):
              return subprocess.check_output(args).decode()

          root = Path.cwd()
          changed = output('git', 'diff', '--name-only', '-z', os.environ['PR_BASE'], os.environ['GITHUB_SHA'], '--').split('\0')
          # Shared test fixtures and module changes can affect every package.
          all_packages = any(p in ('go.mod', 'go.sum') or p.startswith(('testutil/', '3rdparty/')) for p in changed)
          directories = output('go', 'list', '-f', '{{.Dir}}', './pkg/...', './cmd/...', './api/...').splitlines()
          packages = []
          for directory in directories:
              relative = Path(directory).relative_to(root).as_posix()
              # Include fixture changes and deleted files, not only *.go edits.
              if all_packages or any(p.startswith(relative + '/') and '/' not in p[len(relative) + 1:] for p in changed):
                  packages.append('./' + relative)
          Path('quick-packages.txt').write_text(''.join(p + '\n' for p in packages))
          files = [p for p in changed if p.endswith('.go') and Path(p).is_file() and not p.startswith(('3rdparty/', 'docs/'))]
          Path('quick-go-files.txt').write_text(''.join(p + '\n' for p in files))
          print('Changed packages:', packages)
          PYTHON

      - name: Check changed Go formatting
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            if [[ -n "$(gofmt -l "${file}")" ]]; then
              echo "::error file=${file}::Run gofmt on this file."
              exit 1
            fi
          done < quick-go-files.txt

      - name: go vet
        run: go vet -composites=false ./pkg/... ./cmd/... ./api/...

      - name: go mod tidy check
        run: go mod tidy -diff

      - name: Build
        run: go build ./cmd/speedle-pms/... ./cmd/speedle-ads/... ./cmd/spctl/...

      - name: Test changed packages without integration services
        env:
          STORE_TYPE: file
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            case "${package}" in
              ./pkg/store/etcd|./pkg/store/mongodb)
                echo "Compile only: ${package}; service-backed tests run in full CI."
                go test -c -o "${RUNNER_TEMP}/quick-${package##*/}.test" "${package}" ;;
              *) go test -count=1 -timeout 300s "${package}" ;;
            esac
          done < quick-packages.txt

  # Keep a single stable check for either route. No protection is configured
  # today; maintainers can require "CI" without requiring path-specific jobs.
  summary:
    name: CI
    needs: [changes, quick, lint, test, build]
    if: always() && needs.changes.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the selected CI path
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          jobs = json.loads(os.environ['RESULTS'])
          assert jobs['changes']['result'] == 'success', jobs
          full = jobs['changes']['outputs']['full'] == 'true'
          required = ['test'] if full else ['quick']
          outputs = jobs['changes']['outputs']
          if full and outputs['go'] == 'true':
              required.append('lint')
          if full and any(outputs[key] == 'true' for key in ('go', 'website', 'docs')):
              required.append('build')
          for name in required:
              assert jobs[name]['result'] == 'success', (name, jobs[name])
          assert all(job['result'] in ('success', 'skipped') for job in jobs.values()), jobs
          print('Full CI passed.' if full else 'Quick CI passed; full-ci or merge-head is required before merge.')
          PYTHON
