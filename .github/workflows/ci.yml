name: Speedle Plus CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: lint

  test:
    name: test (${{ matrix.store-type }})
    strategy:
      matrix:
        store-type: [file, etcd]
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: test
      store_type: ${{ matrix.store-type }}

  build:
    name: build
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: build
