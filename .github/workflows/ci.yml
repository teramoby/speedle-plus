name: Speedle Plus CI

on:
  # Pull requests are checked by their pull_request run; pushes are checked on
  # master only, so a pull request branch is not tested twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request supersedes its older, still-running checks.
# master pushes are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Run only what a change can affect:
  #   go      - Go lint/build: anything outside docs/, website/ and root
  #             Markdown, including CI configuration
  #   website - Playground engine and site tooling
  #   docs    - published GitHub Pages content
  # The build job runs verify.sh, including the generated-site checks, for
  # any of them. An unknown base (workflow_dispatch, new branch) runs
  # everything. Every test runs on the self-hosted runners through the
  # worker; MySQL, MongoDB and the Docker storage guides run nightly.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.scope.outputs.go }}
      website: ${{ steps.scope.outputs.website }}
      docs: ${{ steps.scope.outputs.docs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          go=true website=true docs=true
          if [[ -n "${base}" && "${base}" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "${base}" "${GITHUB_SHA}")
            go=false website=false docs=false
            while IFS= read -r file; do
              case "${file}" in
                '') ;;
                docs/*) docs=true ;;
                website/*) website=true ;;
                */*) go=true ;;
                *.md) ;;
                *) go=true ;;
              esac
            done <<< "${changed}"
          fi
          {
            echo "go=${go}"
            echo "website=${website}"
            echo "docs=${docs}"
          } >> "${GITHUB_OUTPUT}"
          echo "Go: ${go}; website tooling: ${website}; docs: ${docs}"

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: lint

  # Global merge gate for every PR and master push, regardless of changed paths:
  # Go tests, coverage, and both executable documentation walkthroughs.
  test:
    name: test
    needs: changes
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: test

  build:
    name: build
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.website == 'true' || needs.changes.outputs.docs == 'true'
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: build
