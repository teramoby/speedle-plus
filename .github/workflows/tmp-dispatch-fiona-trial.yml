name: Dispatch one Fiona trial
on:
  push:
    branches: [codex/dispatch-fiona-trial-20261030]
    paths: [.github/workflows/tmp-dispatch-fiona-trial.yml]
permissions:
  actions: write
jobs:
  dispatch:
    if: github.repository == 'teramoby/speedle-plus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the candidate trial once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mongodb-nightly-validation.yml --repo teramoby/speedle-plus --ref codex/fiona-nightly-trial -f nightly_trial=true -f install_flock=true
