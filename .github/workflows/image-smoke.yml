name: Image smoke

# Builds the published Speedle image for this runner's architecture and runs
# scripts/release-smoke.sh. The Release workflow runs that same script after
# it has built linux/amd64 and linux/arm64, and before it creates a tag.
on:
  pull_request:
    paths:
      - deployment/container/**
      - .github/workflows/release.yml
      - .github/workflows/image-smoke.yml
      - scripts/release-smoke.sh
      - cmd/**

permissions: {}

concurrency:
  group: image-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  smoke:
    name: image smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout the pull request
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build and load the host image
        run: |
          set -euo pipefail
          host_arch=$(go env GOHOSTARCH)
          case "${host_arch}" in
            amd64|arm64) ;;
            *) echo "Unsupported release smoke host architecture: ${host_arch}" >&2; exit 1 ;;
          esac
          rm -rf dist container-context
          mkdir -p dist container-context/data
          : > container-context/data/.keep
          for command in spctl speedle-pms speedle-ads; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${host_arch}" go build -trimpath -o "dist/${command}_linux_${host_arch}" "./cmd/${command}"
          done
          cp "dist/speedle-pms_linux_${host_arch}" "container-context/speedle-pms-linux-${host_arch}"
          cp "dist/speedle-ads_linux_${host_arch}" "container-context/speedle-ads-linux-${host_arch}"
          cp "dist/spctl_linux_${host_arch}" "container-context/spctl-linux-${host_arch}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${host_arch}" go build -trimpath -o "container-context/dispatch-linux-${host_arch}" ./deployment/container/dispatch
          docker buildx build \
            --platform "linux/${host_arch}" --load \
            --file deployment/container/Dockerfile \
            --tag speedle:smoke container-context

      - name: Smoke-test the image
        run: bash scripts/release-smoke.sh
