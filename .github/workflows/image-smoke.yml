name: Image smoke

# Builds the published Speedle image for linux/amd64 and linux/arm64, loads
# the runner's architecture and runs scripts/release-smoke.sh. The Release
# workflow runs that same script after it has built both architectures and
# before it creates a tag.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [master]

permissions: {}

concurrency:
  group: image-smoke-${{ github.event.pull_request.number || github.sha }}${{ (github.event.action == 'unlabeled' || (github.event.action == 'labeled' && github.event.label.name != 'full-ci' && github.event.label.name != 'merge-head')) && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: image changes
    if: >-
      github.event.action != 'unlabeled'
      && (github.event.action != 'labeled'
      || github.event.label.name == 'full-ci' || github.event.label.name == 'merge-head')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      smoke: ${{ steps.scope.outputs.smoke }}
    steps:
      - name: Checkout changed paths
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Event-level paths would also suppress full-ci/merge-head label events.
      # Preserve the original path filter here, unioned with the label rules.
      - name: Select image smoke
        id: scope
        env:
          ALWAYS_SMOKE: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'full-ci') || contains(github.event.pull_request.labels.*.name, 'merge-head') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess
          smoke = os.environ['ALWAYS_SMOKE'] == 'true'
          if not smoke:
              changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['PR_BASE'], os.environ['GITHUB_SHA'], '--']).decode().split('\0')
              smoke = any(p.startswith(('deployment/container/', 'cmd/')) or p in (
                  '.github/workflows/release.yml', '.github/workflows/image-smoke.yml', 'scripts/release-smoke.sh'
              ) for p in changed)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('smoke=' + str(smoke).lower() + '\n')
          PYTHON

  smoke:
    needs: changes
    name: ${{ needs.changes.outputs.smoke == 'true' && 'image smoke' || format('Ignored image event {0}', github.run_id) }}
    if: needs.changes.outputs.smoke == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # checkout the pull request
    steps:
      - name: Checkout the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Build the image for both architectures and load the host architecture
        run: |
          set -euo pipefail
          host_arch=$(go env GOHOSTARCH)
          case "${host_arch}" in
            amd64|arm64) ;;
            *) echo "Unsupported release smoke host architecture: ${host_arch}" >&2; exit 1 ;;
          esac
          rm -rf dist container-context
          mkdir -p dist container-context/data
          : > container-context/data/.keep
          # The same context and Dockerfile the Release workflow uses, so a
          # TARGETARCH mapping or COPY mistake fails on the pull request.
          for arch in amd64 arm64; do
            for command in spctl speedle-pms speedle-ads; do
              CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -o "dist/${command}_linux_${arch}" "./cmd/${command}"
            done
            cp "dist/speedle-pms_linux_${arch}" "container-context/speedle-pms-linux-${arch}"
            cp "dist/speedle-ads_linux_${arch}" "container-context/speedle-ads-linux-${arch}"
            cp "dist/spctl_linux_${arch}" "container-context/spctl-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -o "container-context/dispatch-linux-${arch}" ./deployment/container/dispatch
          done
          ca_bundle=/etc/ssl/certs/ca-certificates.crt
          [[ -r "${ca_bundle}" ]] || { echo "Missing ${ca_bundle} on the runner." >&2; exit 1; }
          cp "${ca_bundle}" container-context/ca-certificates.crt
          docker buildx create --name speedle-smoke --driver docker-container --use
          docker buildx inspect --bootstrap
          # Both architectures must build. Nothing is pushed.
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deployment/container/Dockerfile \
            --output type=cacheonly container-context
          docker buildx build \
            --platform "linux/${host_arch}" --load \
            --file deployment/container/Dockerfile \
            --tag speedle:smoke container-context

      - name: Smoke-test the image
        run: bash scripts/release-smoke.sh
