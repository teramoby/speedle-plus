# Validate the ReviewBot runner override before any job receives provider
# credentials. reviewbot.yml and reviewbot-command.yml call this workflow and
# make their model-calling jobs depend on it, so an unapproved label set fails
# the run before a provider key reaches a runner.
name: ReviewBot runner preflight

on:
  workflow_call:
    outputs:
      runs_on:
        description: The validated REVIEWBOT_RUNS_ON label set, canonicalized.
        value: ${{ jobs.validate.outputs.runs_on }}

permissions: {}

jobs:
  validate:
    name: Validate ReviewBot runner override
    # A GitHub-hosted runner needs no repository content and never receives a
    # secret, so the validation itself cannot be influenced by a pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # The credential-bearing jobs route on this value instead of re-reading
    # the variable, so the approved set is the set they run on.
    outputs:
      runs_on: ${{ steps.check.outputs.runs_on }}
    env:
      # The only label sets REVIEWBOT_RUNS_ON may select. This line is the
      # single allowlist: scripts/tests/test_runner_routing.cjs parses it and
      # executes the step below with the same value, so the workflow and the
      # routing suite cannot drift. Labels inside a set are order-insensitive.
      # A different set requires a reviewed change here.
      APPROVED_REVIEWBOT_RUNS_ON: '[["self-hosted","speedle-runner"],["self-hosted","Linux","reviewbot"],["self-hosted","Linux","X64","reviewbot"]]'
      CONFIGURED_REVIEWBOT_RUNS_ON: ${{ vars.REVIEWBOT_RUNS_ON || '["self-hosted","speedle-runner"]' }}
    steps:
      - name: Reject a runner override outside the approved label sets
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if ! configured=$(jq -ce '
            if type == "array" and length > 0 and all(.[]; type == "string" and length > 0)
            then sort
            else empty
            end' <<< "${CONFIGURED_REVIEWBOT_RUNS_ON}" 2>/dev/null); then
            configured=''
          fi
          if [[ -z "${configured}" ]]; then
            printf 'REVIEWBOT_RUNS_ON=%q is not a non-empty JSON array of runner labels.\n' \
              "${CONFIGURED_REVIEWBOT_RUNS_ON}" >&2
            exit 1
          fi
          if ! jq -e --argjson configured "${configured}" 'any(.[]; sort == $configured)' \
              <<< "${APPROVED_REVIEWBOT_RUNS_ON}" >/dev/null; then
            printf 'REVIEWBOT_RUNS_ON=%q is not an approved ReviewBot runner label set.\n' \
              "${CONFIGURED_REVIEWBOT_RUNS_ON}" >&2
            exit 1
          fi
          printf 'REVIEWBOT_RUNS_ON=%q is an approved ReviewBot runner label set.\n' \
            "${CONFIGURED_REVIEWBOT_RUNS_ON}"
          printf 'runs_on=%s\n' "${configured}" >> "${GITHUB_OUTPUT}"
