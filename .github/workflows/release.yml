name: Release

# Run by hand from the Actions tab (or the API) to tag a master commit, build
# the release binaries and one container image, publish a GitHub release, and
# push the Helm chart. Only users with write access can dispatch it. See
# docs/RELEASE.md.
#
# The image is docker.io/speedle/speedle and ghcr.io/<owner>/speedle. It
# contains speedle-pms, speedle-ads and spctl. Git tags stay vX.Y.Z. Image
# tags are X.Y.Z, X.Y when this is the highest patch of that minor, and
# latest when this is the highest release on the newest master commit.
# Docker Hub reads DOCKERHUB_USERNAME and
# DOCKERHUB_TOKEN from the release environment.
#
# When HOMEBREW_TAP_TOKEN is set on that environment, the workflow pushes a
# homebrew-vX.Y.Z branch to teramoby/homebrew-tap and opens a pull request
# against main. It does not push main or master. It also opens a pull request
# on this repository with the same formulas and the Quick Start install pin
# for this version. When HOMEBREW_TAP_TOKEN is unset, that step is skipped
# and the release still succeeds. See docs/RELEASE.md.
#
# Retrying: re-dispatch with the same version and commit after a failure. An
# existing tag must already point at the same commit, the version image tag
# is published again, and release assets are replaced, so a failed run resumes
# without moving a tag or re-creating a release. The image is built and
# smoke-tested before the tag, and published last; if the push fails,
# re-dispatching completes the release. A failed chart push or Homebrew tap
# update is finished the same way.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag, for example v2.0.0"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the master commit to tag"
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTAINER_CONTEXT: container-context

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # tag the commit, publish the GitHub release, and push the formula branch
      packages: write # push the image to GHCR
      pull-requests: write # open the Homebrew formula pull request
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v2.0.0." >&2; exit 1; }
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit must be a full lowercase SHA." >&2; exit 1; }

      # Presence only. The username and token values are passed to the shell
      # in the Docker Hub login step, and nowhere else. This step is before
      # the tag so a missing credential cannot leave a tag without an image.
      - name: Require Docker Hub credentials
        env:
          DOCKERHUB_USERNAME_SET: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          DOCKERHUB_TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${DOCKERHUB_USERNAME_SET}" != "true" || "${DOCKERHUB_TOKEN_SET}" != "true" ]]; then
            echo "The release environment needs both DOCKERHUB_USERNAME and DOCKERHUB_TOKEN. No release tag was created." >&2
            exit 1
          fi

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0
          # The publish step reads local vX.Y.Z tags to decide whether to move latest.
          fetch-tags: true
          persist-credentials: false

      # The release commit checked out below may be older than these files.
      # Keep the copies from master so the tap update still has them.
      - name: Keep the Homebrew tap files
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/homebrew"
          cp -R deployment/homebrew/. "${RUNNER_TEMP}/homebrew/"

      - name: Check the commit, module path and tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${COMMIT}" origin/master || { echo "${COMMIT} is not on master." >&2; exit 1; }
          # Go accepts a v2+ tag only when the module path ends in the major version.
          major="${VERSION%%.*}"
          module=$(git show "${COMMIT}:go.mod" | awk '$1 == "module" { print $2; exit }')
          case "${major}" in
            v0|v1) expected=github.com/teramoby/speedle-plus ;;
            *) expected="github.com/teramoby/speedle-plus/${major}" ;;
          esac
          [[ "${module}" == "${expected}" ]] || { echo "go.mod at ${COMMIT} declares ${module}; ${VERSION} needs ${expected}." >&2; exit 1; }
          # A re-run may find the tag from an earlier attempt. The Go module
          # proxy caches tags, so an existing tag is only allowed to stay when
          # it already points at the requested commit.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            # Annotated tags point at a tag object. Fetch the tag and let
            # rev-list resolve it to the commit, independent of how ls-remote
            # renders peeled refs.
            git fetch --force --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            tagged=$(git rev-list -n 1 "refs/tags/${VERSION}")
            [[ "${tagged}" == "${COMMIT}" ]] || {
              echo "Tag ${VERSION} already exists at ${tagged}, not ${COMMIT}; it is never moved." >&2
              exit 1
            }
            echo "Tag ${VERSION} already points at ${COMMIT}; this is a re-run."
          fi

      - name: Check out the release commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git checkout --detach "${COMMIT}"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # macOS and Linux, amd64 and arm64, for the three public commands. The
      # binaries are static where the target allows it and are never installed
      # into a shared GOBIN.
      - name: Build release binaries
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            for command in spctl speedle-pms speedle-ads; do
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -o "dist/${command}_${goos}_${goarch}" "./cmd/${command}"
            done
            cp "dist/spctl_${goos}_${goarch}" "dist/speedle-spctl_${goos}_${goarch}"
          done

      - name: Write checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum spctl_* speedle-spctl_* speedle-ads_* speedle-pms_* > checksums.txt)
          cat dist/checksums.txt

      - name: Prepare the container build context
        run: |
          set -euo pipefail
          rm -rf "${CONTAINER_CONTEXT}"
          mkdir -p "${CONTAINER_CONTEXT}/data"
          : > "${CONTAINER_CONTEXT}/data/.keep"
          # The image is FROM scratch, so copy the runner's public CA bundle
          # into the context for Go's system roots.
          ca_bundle=/etc/ssl/certs/ca-certificates.crt
          [[ -r "${ca_bundle}" ]] || { echo "Missing ${ca_bundle} on the runner." >&2; exit 1; }
          cp "${ca_bundle}" "${CONTAINER_CONTEXT}/ca-certificates.crt"
          for arch in amd64 arm64; do
            cp "dist/speedle-pms_linux_${arch}" "${CONTAINER_CONTEXT}/speedle-pms-linux-${arch}"
            cp "dist/speedle-ads_linux_${arch}" "${CONTAINER_CONTEXT}/speedle-ads-linux-${arch}"
            cp "dist/spctl_linux_${arch}" "${CONTAINER_CONTEXT}/spctl-linux-${arch}"
            CGO_ENABLED=0 GOOS=linux GOARCH="${arch}" go build -trimpath -o "${CONTAINER_CONTEXT}/dispatch-linux-${arch}" ./deployment/container/dispatch
          done

      # Build the image before the immutable tag is created, then run the same
      # smoke script as the pull-request image smoke job. A bad Dockerfile,
      # TARGETARCH mapping or runtime permission problem stops the run before
      # a tag exists.
      - name: Verify the container image builds and starts
        run: |
          set -euo pipefail
          host_arch=$(go env GOHOSTARCH)
          case "${host_arch}" in
            amd64|arm64) ;;
            *) echo "Unsupported release smoke host architecture: ${host_arch}" >&2; exit 1 ;;
          esac
          docker buildx create --name speedle-smoke --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file deployment/container/Dockerfile \
            --output type=cacheonly "${CONTAINER_CONTEXT}"
          docker buildx build \
            --platform "linux/${host_arch}" --load \
            --file deployment/container/Dockerfile \
            --tag speedle:smoke "${CONTAINER_CONTEXT}"
          bash scripts/release-smoke.sh

      # Idempotent for re-runs: the validation above only lets an existing tag
      # through when it already points at the requested commit.
      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            # Re-resolve the tag now: it may have appeared or changed since the
            # validation step above.
            git fetch --force --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            tagged=$(git rev-list -n 1 "refs/tags/${VERSION}")
            [[ "${tagged}" == "${COMMIT}" ]] || {
              echo "Tag ${VERSION} now points at ${tagged}, not ${COMMIT}; refusing to publish." >&2
              exit 1
            }
            echo "Tag ${VERSION} already exists at ${COMMIT}; no tag created."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" "${COMMIT}" -m "Speedle ${VERSION}"
            # Checkout does not persist credentials. gh supplies the workflow
            # token for this push and does not write it into the workspace.
            gh auth setup-git
            git push origin "refs/tags/${VERSION}"
          fi

      # Re-runs replace the assets of an existing release instead of failing.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          assets=(dist/spctl_* dist/speedle-spctl_* dist/speedle-pms_* dist/speedle-ads_* dist/checksums.txt)
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${VERSION}" --generate-notes \
              "${assets[@]}"
          fi

      - name: Log in to container registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
          printf '%s\n' "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      # One multi-architecture image, pushed to Docker Hub and GHCR. The
      # Dockerfile copies the matching Linux binaries for TARGETARCH. The image
      # is published last, after the immutable tag: a version image can then
      # never exist without its git tag or be overwritten from a different
      # commit. If this step fails, the idempotent tag and release steps above
      # let a re-dispatch finish the release without moving or re-creating
      # anything. `X.Y` moves only when this version is the highest patch of
      # that minor, so retrying an older patch cannot replace it. `latest`
      # moves only when this version is the highest full semantic version
      # released so far and the requested commit is still the newest commit on
      # master. Provenance and the SBOM are attached to the pushed image.
      - name: Publish the container image
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_version="${VERSION#v}"
          image_minor="${image_version%.*}"
          [[ "${image_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Image version must look like 2.0.0." >&2; exit 1; }
          master=$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')
          [[ "${master}" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve the newest commit on master." >&2; exit 1; }
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          docker buildx create --name speedle-release --driver docker-container --use
          docker buildx inspect --bootstrap
          tag_args=(
            --tag "docker.io/speedle/speedle:${image_version}"
            --tag "${REGISTRY}/${owner}/speedle:${image_version}"
          )
          # Dots in the minor are literal. An older patch must not move X.Y.
          minor_re=$(printf '%s\n' "${image_minor}" | sed 's/\./\\./g')
          highest_minor=$(git tag --list "v${image_minor}.*" | grep -E "^v${minor_re}\.[0-9]+$" | sort -V | tail -n 1 || true)
          move_minor=0
          if [[ -z "${highest_minor}" ]]; then
            move_minor=1
          else
            top=$(printf '%s\n%s\n' "${highest_minor}" "${VERSION}" | sort -V | tail -n 1)
            if [[ "${top}" == "${VERSION}" ]]; then
              move_minor=1
            fi
          fi
          if [[ "${move_minor}" == 1 ]]; then
            tag_args+=(
              --tag "docker.io/speedle/speedle:${image_minor}"
              --tag "${REGISTRY}/${owner}/speedle:${image_minor}"
            )
          else
            echo "${VERSION} is not the highest ${image_minor} patch (${highest_minor}); leaving the ${image_minor} tag in place."
          fi
          if [[ "${COMMIT}" == "${master}" && ( -z "${newest}" || "${VERSION}" == "${newest}" ) ]]; then
            tag_args+=(
              --tag "docker.io/speedle/speedle:latest"
              --tag "${REGISTRY}/${owner}/speedle:latest"
            )
          else
            echo "${VERSION} at ${COMMIT} is not the highest release (${newest}) on the newest master commit (${master}); leaving latest in place."
          fi
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=mode=max \
            --sbom=true \
            --file deployment/container/Dockerfile \
            "${tag_args[@]}" \
            --push "${CONTAINER_CONTEXT}"

      # Package the chart from this commit after the image exists. The chart
      # version and appVersion are the image version. A commit that predates
      # the chart skips this step so an older release can still be re-run.
      # Helm v3.22.1 linux-amd64, same pin as scripts/ci/install-helm.sh.
      - name: Publish the Helm chart
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! -f deployment/helm/speedle/Chart.yaml ]]; then
            echo "This commit has no deployment/helm/speedle chart. Skipping the chart publish."
            exit 0
          fi
          [[ "$(uname -m)" == "x86_64" ]] || { echo "The Helm publish step expects linux-amd64." >&2; exit 1; }
          helm_version=v3.22.1
          helm_checksum=896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea
          tmp=$(mktemp -d)
          curl -fsSL -o "${tmp}/helm.tgz" "https://get.helm.sh/helm-${helm_version}-linux-amd64.tar.gz"
          echo "${helm_checksum}  ${tmp}/helm.tgz" | sha256sum -c -
          tar -C "${tmp}" -xzf "${tmp}/helm.tgz"
          sudo install -m 755 "${tmp}/linux-amd64/helm" /usr/local/bin/helm
          rm -rf "${tmp}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          chart_version="${VERSION#v}"
          [[ "${chart_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Chart version must look like 2.0.0." >&2; exit 1; }
          printf '%s\n' "${GITHUB_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm package deployment/helm/speedle --version "${chart_version}" --app-version "${chart_version}" --destination dist
          helm push "dist/speedle-${chart_version}.tgz" "oci://${REGISTRY}/${owner}/charts"

      # Presence only. The token value is passed to the publish step and
      # nowhere else. An unset token skips the tap and still leaves a release.
      - name: Check for the Homebrew tap token
        id: homebrew
        env:
          HOMEBREW_TAP_TOKEN_SET: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
        run: |
          set -euo pipefail
          if [[ "${HOMEBREW_TAP_TOKEN_SET}" != "true" ]]; then
            echo "HOMEBREW_TAP_TOKEN is not set. Skipping the Homebrew tap update. The release is unchanged."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish the Homebrew tap
        if: steps.homebrew.outputs.skip != 'true'
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CHECKSUMS: dist/checksums.txt
        run: bash "${RUNNER_TEMP}/homebrew/publish-tap.sh"
