name: Release

# Run by hand from the Actions tab (or the API) to tag a master commit, build
# the release binaries and container images, and publish a GitHub release.
# Only users with write access can dispatch it.
#
# Retrying: re-dispatch with the same version and commit after a failure. An
# existing tag must already point at the same commit, image tags are
# overwritten, and release assets are replaced, so a failed run resumes
# without moving a tag or re-creating a release. The images are built without
# pushing before the tag, and published last; if the push fails, re-dispatching
# completes the release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version tag, for example v2.0.0"
        required: true
        type: string
      commit:
        description: "Full 40-character SHA of the master commit to tag"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTAINER_CONTEXT: container-context

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate inputs
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like v2.0.0." >&2; exit 1; }
          [[ "${COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo "Commit must be a full lowercase SHA." >&2; exit 1; }

      - name: Checkout master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: master
          fetch-depth: 0

      - name: Check the commit, module path and tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${COMMIT}" origin/master || { echo "${COMMIT} is not on master." >&2; exit 1; }
          # Go accepts a v2+ tag only when the module path ends in the major version.
          major="${VERSION%%.*}"
          module=$(git show "${COMMIT}:go.mod" | awk '$1 == "module" { print $2; exit }')
          case "${major}" in
            v0|v1) expected=github.com/teramoby/speedle-plus ;;
            *) expected="github.com/teramoby/speedle-plus/${major}" ;;
          esac
          [[ "${module}" == "${expected}" ]] || { echo "go.mod at ${COMMIT} declares ${module}; ${VERSION} needs ${expected}." >&2; exit 1; }
          # A re-run may find the tag from an earlier attempt. The Go module
          # proxy caches tags, so an existing tag is only allowed to stay when
          # it already points at the requested commit.
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            # Annotated tags point at a tag object. Fetch the tag and let
            # rev-list resolve it to the commit, independent of how ls-remote
            # renders peeled refs.
            git fetch --force --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            tagged=$(git rev-list -n 1 "refs/tags/${VERSION}")
            [[ "${tagged}" == "${COMMIT}" ]] || {
              echo "Tag ${VERSION} already exists at ${tagged}, not ${COMMIT}; it is never moved." >&2
              exit 1
            }
            echo "Tag ${VERSION} already points at ${COMMIT}; this is a re-run."
          fi

      - name: Check out the release commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git checkout --detach "${COMMIT}"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # macOS and Linux, amd64 and arm64, for the three public commands. The
      # binaries are static where the target allows it and are never installed
      # into a shared GOBIN.
      - name: Build release binaries
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            goos=${target%/*}
            goarch=${target#*/}
            for command in spctl speedle-pms speedle-ads; do
              CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -o "dist/${command}_${goos}_${goarch}" "./cmd/${command}"
            done
          done

      - name: Write checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum spctl_* speedle-ads_* speedle-pms_* > checksums.txt)
          cat dist/checksums.txt

      - name: Prepare the container build context
        run: |
          set -euo pipefail
          rm -rf "${CONTAINER_CONTEXT}"
          mkdir -p "${CONTAINER_CONTEXT}/data"
          : > "${CONTAINER_CONTEXT}/data/.keep"
          for arch in amd64 arm64; do
            cp "dist/speedle-pms_linux_${arch}" "${CONTAINER_CONTEXT}/speedle-pms-linux-${arch}"
            cp "dist/speedle-ads_linux_${arch}" "${CONTAINER_CONTEXT}/speedle-ads-linux-${arch}"
          done

      # Build and start both images before the immutable tag is created, so a
      # bad Dockerfile, TARGETARCH mapping or runtime permission problem cannot
      # leave a published release without working images.
      - name: Verify the container images build and start
        run: |
          set -euo pipefail
          docker buildx create --name speedle-smoke --driver docker-container --use
          docker buildx inspect --bootstrap
          trap 'docker stop speedle-smoke-pms speedle-smoke-ads >/dev/null 2>&1 || true; docker volume rm speedle-smoke >/dev/null 2>&1 || true' EXIT
          for command in speedle-pms speedle-ads; do
            suffix=${command#speedle-}
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "deployment/container/Dockerfile.${suffix}" \
              --output type=cacheonly "${CONTAINER_CONTEXT}"
            docker buildx build \
              --platform linux/amd64 --load \
              --file "deployment/container/Dockerfile.${suffix}" \
              --tag "${command}:smoke" "${CONTAINER_CONTEXT}"
          done
          docker volume rm speedle-smoke >/dev/null 2>&1 || true
          docker volume create speedle-smoke >/dev/null
          docker run --rm -d --name speedle-smoke-pms -p 127.0.0.1:6733:6733 -v speedle-smoke:/data \
            speedle-pms:smoke --store-type file --filestore-loc /data/policies.json --endpoint 0.0.0.0:6733 --insecure=true
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:6733/policy-mgmt/v1/service >/dev/null
          # Write through PMS, then read the same volume through both the API and
          # ADS. Starting an empty file store alone does not catch volume or
          # permission failures, and ADS proves the persisted policy is usable.
          dist/spctl_linux_amd64 --pms-endpoint http://127.0.0.1:6733/policy-mgmt/v1/ create service smoke
          dist/spctl_linux_amd64 --pms-endpoint http://127.0.0.1:6733/policy-mgmt/v1/ create policy \
            -c "grant user smoke-user read smoke-resource" --service-name=smoke
          dist/spctl_linux_amd64 --pms-endpoint http://127.0.0.1:6733/policy-mgmt/v1/ get service --all | \
            python3 -c 'import json, sys; services = json.load(sys.stdin); assert any(s.get("name") == "smoke" and len(s.get("policies", [])) == 1 for s in services), services'
          docker stop speedle-smoke-pms >/dev/null
          docker run --rm -d --name speedle-smoke-ads -p 127.0.0.1:6734:6734 -v speedle-smoke:/data \
            speedle-ads:smoke --store-type file --filestore-loc /data/policies.json --endpoint 0.0.0.0:6734 --insecure=true
          decision=$(curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --header 'Content-Type: application/json' \
            --data '{"subject":{"principals":[{"type":"user","name":"smoke-user"}]},"serviceName":"smoke","resource":"smoke-resource","action":"read"}' \
            http://127.0.0.1:6734/authz-check/v1/is-allowed)
          python3 -c 'import json, sys; result = json.load(sys.stdin); assert result.get("allowed") is True and result.get("reason") == 0, result' <<< "${decision}"
          docker stop speedle-smoke-ads >/dev/null

      # Idempotent for re-runs: the validation above only lets an existing tag
      # through when it already points at the requested commit.
      - name: Create and push the tag
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            # Re-resolve the tag now: it may have appeared or changed since the
            # validation step above.
            git fetch --force --quiet origin "refs/tags/${VERSION}:refs/tags/${VERSION}"
            tagged=$(git rev-list -n 1 "refs/tags/${VERSION}")
            [[ "${tagged}" == "${COMMIT}" ]] || {
              echo "Tag ${VERSION} now points at ${tagged}, not ${COMMIT}; refusing to publish." >&2
              exit 1
            }
            echo "Tag ${VERSION} already exists at ${COMMIT}; no tag created."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${VERSION}" "${COMMIT}" -m "Speedle ${VERSION}"
            git push origin "refs/tags/${VERSION}"
          fi

      # Re-runs replace the assets of an existing release instead of failing.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          assets=(dist/spctl_* dist/speedle-pms_* dist/speedle-ads_* dist/checksums.txt)
          if gh release view "${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${VERSION}" --repo "${GITHUB_REPOSITORY}" --clobber "${assets[@]}"
          else
            gh release create "${VERSION}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${VERSION}" --generate-notes \
              "${assets[@]}"
          fi

      # One multi-architecture image per service. The Dockerfiles copy the
      # matching Linux binary for TARGETARCH. Images are published last, after
      # the immutable tag: a version image can then never exist without its git
      # tag or be overwritten from a different commit. If this step fails, the
      # idempotent tag and release steps above let a re-dispatch finish the
      # release without moving or re-creating anything. `latest` moves only
      # when this version is the highest full semantic version released so far
      # and the requested commit is still the newest commit on master, so a
      # maintenance release or a release from an older master cannot downgrade it.
      - name: Publish container images
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          master=$(git ls-remote origin refs/heads/master | awk 'NR == 1 { print $1 }')
          [[ "${master}" =~ ^[0-9a-f]{40}$ ]] || { echo "Could not resolve the newest commit on master." >&2; exit 1; }
          newest=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "${GITHUB_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker buildx create --name speedle-release --driver docker-container --use
          docker buildx inspect --bootstrap
          for command in speedle-pms speedle-ads; do
            suffix=${command#speedle-}
            tag_args=(--tag "${REGISTRY}/${owner}/${command}:${VERSION}")
            if [[ "${COMMIT}" == "${master}" && ( -z "${newest}" || "${VERSION}" == "${newest}" ) ]]; then
              tag_args+=(--tag "${REGISTRY}/${owner}/${command}:latest")
            else
              echo "${VERSION} at ${COMMIT} is not the highest release (${newest}) on the newest master commit (${master}); publishing only the version tag."
            fi
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              --file "deployment/container/Dockerfile.${suffix}" \
              "${tag_args[@]}" \
              --push "${CONTAINER_CONTEXT}"
          done
