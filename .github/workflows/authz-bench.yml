name: Authorization engine comparison

# Manual only. Runs benchmarks/private/benchmark-by-llm on charming: Casbin,
# OPA, Cedar (cedar-go and the Rust implementation) and Speedle+ (current
# and May 2026 builds). A hosted job builds the package from the dispatched
# ref; the charming job only runs the prebuilt binaries, waits for other CI
# jobs on the host to finish and repeats any step one of them disturbed.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authz-bench
  cancel-in-progress: false

jobs:
  package:
    name: package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: benchmarks/private/benchmark-by-llm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
          cache: false

      - name: Build the package
        run: ./build-package.sh dist/authz-bench-linux

      - name: Upload the package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: authz-bench-package
          path: benchmarks/private/benchmark-by-llm/dist/authz-bench-linux/
          if-no-files-found: error

  run:
    name: run
    needs: package
    uses: teramoby/speedle-plus/.github/workflows/go-ci-worker.yml@master
    with:
      mode: authz-bench
