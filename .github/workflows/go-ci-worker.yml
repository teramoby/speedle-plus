name: Go CI worker

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: execute
    # The runner group accepts only this callee at refs/heads/master. Never
    # derive runner eligibility or checkout revision from caller inputs.
    # Nightly and post-merge regression can use either charming runner; the
    # host lock below protects legacy fixed-port tests shared by both instances.
    runs-on: >-
      ${{ github.repository == 'teramoby/speedle-plus' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.event.sender.type == 'User' || github.event.sender.type == 'Bot')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.type == 'User' || github.event.pull_request.user.type == 'Bot'))) && fromJSON((inputs.mode == 'test' || inputs.mode == 'weekly') && '["self-hosted","Linux","X64","charming-speedle"]' || '["self-hosted","Linux","X64","speedle-linux"]') || 'ubuntu-latest' }}
    timeout-minutes: ${{ (inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression') && 150 || 30 }}
    steps:
      - name: Validate CI task
        env:
          CI_TASK: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${CI_TASK}" in lint|test|build|nightly|weekly|regression) ;; *) echo 'Invalid CI task.' >&2; exit 1 ;; esac

      - name: Verify self-hosted runner identity
        if: runner.environment == 'self-hosted'
        env:
          CI_TASK: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${RUNNER_NAME}" in charming-speedle|charming-speedle-2) ;; *) echo 'Unexpected runner.' >&2; exit 1 ;; esac
          case "${CI_TASK}" in test|weekly) test "${RUNNER_NAME}" = charming-speedle ;; esac
          test "${RUNNER_OS}" = Linux
          command -v git >/dev/null
          command -v python3 >/dev/null
          echo "Using runner ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})."

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ inputs.mode == 'build' && '0' || '1' }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          # This persistent host already retains the Go caches. Restoring an
          # archive over read-only module files causes noisy extraction failures.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: go vet
        if: inputs.mode == 'lint'
        run: go vet -composites=false ./pkg/... ./cmd/... ./api/...

      - name: go mod tidy check
        if: inputs.mode == 'lint'
        run: go mod tidy -diff

      - name: Setup Node for scheduled checks
        if: inputs.mode == 'nightly'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      # scripts/ci/run-go-tests.sh chooses the packages, stores and checks for
      # each mode; see its header.
      - name: Run Go tests
        if: inputs.mode == 'test' || inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression'
        env:
          CI_TASK: ${{ inputs.mode }}
          RESULTS_DIR: test-results
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          export GOPATH="$(go env GOPATH)"
          # The two runners share a physical host. Hold the lock across the
          # port preflight and every service lifetime, never kill foreign jobs.
          exec 9>/tmp/speedle-plus-test-services.lock
          flock -w 7200 9
          python3 - <<'PYTHON'
          import errno
          import socket
          for port in (2379, 2380, 27017, 6733, 6734):
              for family, address in ((socket.AF_INET, '0.0.0.0'), (socket.AF_INET, '127.0.0.1'), (socket.AF_INET6, '::'), (socket.AF_INET6, '::1')):
                  try:
                      with socket.socket(family, socket.SOCK_STREAM) as probe:
                          probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                          if family == socket.AF_INET6:
                              probe.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                          probe.bind((address, port))
                  except OSError as error:
                      if family == socket.AF_INET6 and error.errno in (errno.EAFNOSUPPORT, errno.EADDRNOTAVAIL):
                          continue
                      raise SystemExit(f'Test service port {port} is in use; refusing to touch an existing service.') from error
          print('Local etcd, MongoDB, PMS and ADS test ports are unused.')
          PYTHON
          case "${CI_TASK}" in
            test) scripts/ci/run-go-tests.sh gate ;;
            *) scripts/ci/run-go-tests.sh "${CI_TASK}" ;;
          esac

      - name: Clean owned MySQL containers
        if: always() && inputs.mode == 'nightly'
        run: |
          python3 scripts/ci/run-mysql-tests.py --cleanup

      - name: Upload coverage
        if: always() && inputs.mode == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload scheduled test results
        if: always() && (inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.mode }}-results
          path: test-results/
          if-no-files-found: warn

      - name: Build
        if: inputs.mode == 'build'
        run: go build ./cmd/speedle-pms/... ./cmd/speedle-ads/... ./cmd/spctl/...

      # The default-branch worker keeps scheduling policy outside PR control.
      - name: Setup pinned Playground Go
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Setup Playground Node
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Verify Playground release
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        run: website/playground-engine/verify.sh
