name: Go CI worker

on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    name: execute
    # The runner group accepts only this callee at refs/heads/master. Never
    # derive runner eligibility or checkout revision from caller inputs.
    # Quick uses QUICK_RUNS_ON (hosted Ubuntu by default). It starts no
    # integration services and supports Linux x64 and macOS ARM64.
    # Every other task but build and weekly goes to any Speedle runner
    # (speedle-runner: both charming instances and fiona). Build needs the
    # Linux Hugo release, so its default is the Linux pool. Weekly stays on
    # fiona to reduce timing noise in its benchmark comparison. The identity
    # check also accepts donkey-speedle (Linux x64) for every task but weekly.
    # merge-head may reserve HEAD_RUNS_ON (a JSON string or labels array)
    # for full jobs, including build. That pool must supply an approved Linux
    # runner; identity checks still reject build on macOS. Scheduled weekly
    # jobs never use the PR-only override.
    # Without it, retain the existing task pools. Labels only select scheduling;
    # the trusted-event predicate and runner identity checks still apply.
    # The host lock below keeps fixed-port tests from overlapping on the charming host.
    runs-on: >-
      ${{ github.repository == 'teramoby/speedle-plus' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.ref == 'refs/heads/master') || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.event.sender.type == 'User' || github.event.sender.type == 'Bot')) || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.type == 'User' || github.event.pull_request.user.type == 'Bot'))) && fromJSON(inputs.mode == 'quick' && (vars.QUICK_RUNS_ON || '"ubuntu-latest"') || github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'merge-head') && vars.HEAD_RUNS_ON || inputs.mode == 'build' && '["self-hosted","Linux","X64","speedle-linux"]' || inputs.mode == 'weekly' && '["self-hosted","fiona-speedle"]' || '["self-hosted","speedle-runner"]') || 'ubuntu-latest' }}
    # test can wait on the host lock behind a nightly on the other charming runner.
    timeout-minutes: ${{ (inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression' || inputs.mode == 'test') && 150 || 30 }}
    steps:
      - name: Validate CI task
        env:
          CI_TASK: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${CI_TASK}" in quick|lint|test|build|nightly|weekly|regression) ;; *) echo 'Invalid CI task.' >&2; exit 1 ;; esac

      - name: Verify self-hosted runner identity
        if: runner.environment == 'self-hosted'
        env:
          CI_TASK: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "${RUNNER_NAME}/${RUNNER_OS}/${RUNNER_ARCH}" in
            charming-speedle/Linux/X64|charming-speedle-2/Linux/X64|donkey-speedle/Linux/X64)
              case "${CI_TASK}" in weekly) echo "Task ${CI_TASK} runs only on fiona-speedle." >&2; exit 1 ;; esac ;;
            fiona-speedle/macOS/ARM64)
              case "${CI_TASK}" in build) echo "Task ${CI_TASK} needs a Linux runner." >&2; exit 1 ;; esac ;;
            *) echo 'Unexpected runner.' >&2; exit 1 ;;
          esac
          command -v git >/dev/null
          command -v python3 >/dev/null
          echo "Using runner ${RUNNER_NAME} (${RUNNER_OS}/${RUNNER_ARCH})."

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: ${{ (inputs.mode == 'build' || inputs.mode == 'quick') && '0' || '1' }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          # This persistent host already retains the Go caches. Restoring an
          # archive over read-only module files causes noisy extraction failures.
          cache: ${{ runner.environment != 'self-hosted' }}

      - name: Select changed packages
        if: inputs.mode == 'quick'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          def output(*args):
              return subprocess.check_output(args).decode()

          root = Path.cwd()
          changed = output('git', 'diff', '--name-only', '-z', os.environ['PR_BASE'], os.environ['GITHUB_SHA'], '--').split('\0')
          # Shared test fixtures and module changes can affect every package.
          all_packages = any(p in ('go.mod', 'go.sum') or p.startswith(('testutil/', '3rdparty/')) for p in changed)
          directories = output('go', 'list', '-f', '{{.Dir}}', './pkg/...', './cmd/...', './api/...').splitlines()
          package_dirs = [Path(d).resolve().relative_to(root).as_posix() for d in directories]
          selected = set(package_dirs) if all_packages else set()
          for file in changed:
              # Attribute nested fixtures and deleted files to their nearest
              # surviving package, without also selecting ancestor packages.
              owners = [d for d in package_dirs if file.startswith(d + '/')]
              if owners:
                  selected.add(max(owners, key=len))
          packages = ['./' + d for d in sorted(selected)]
          Path('quick-packages.txt').write_text(''.join(p + '\n' for p in packages))
          files = [p for p in changed if p.endswith('.go') and Path(p).is_file() and not p.startswith(('3rdparty/', 'docs/'))]
          Path('quick-go-files.txt').write_text(''.join(p + '\n' for p in files))
          print('Changed packages:', packages)
          PYTHON

      - name: Check changed Go formatting
        if: inputs.mode == 'quick'
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            if [[ -n "$(gofmt -l "${file}")" ]]; then
              echo "::error file=${file}::Run gofmt on this file."
              exit 1
            fi
          done < quick-go-files.txt

      - name: Test changed packages without integration services
        if: inputs.mode == 'quick'
        env:
          STORE_TYPE: file
          SPEEDLE_TEST_STORE_PROPS: ''
          SPEEDLE_MYSQL_TEST_DSN: ''
          SPEEDLE_REQUIRE_MYSQL: ''
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          while IFS= read -r package; do
            case "${package}" in
              ./pkg/store/etcd|./pkg/store/mongodb)
                echo "Compile only: ${package}; service-backed tests run in full CI."
                go test -c -o "${RUNNER_TEMP}/quick-${package##*/}.test" "${package}" ;;
              *) go test -count=1 -timeout 300s "${package}" ;;
            esac
          done < quick-packages.txt

      - name: go vet
        if: inputs.mode == 'lint' || inputs.mode == 'quick'
        run: go vet -composites=false ./pkg/... ./cmd/... ./api/...

      - name: go mod tidy check
        if: inputs.mode == 'lint' || inputs.mode == 'quick'
        run: go mod tidy -diff

      - name: Setup Node for scheduled checks
        if: inputs.mode == 'nightly'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      # scripts/ci/run-go-tests.sh chooses the packages, stores and checks for
      # each mode; see its header.
      - name: Run Go tests
        if: inputs.mode == 'test' || inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression'
        env:
          CI_TASK: ${{ inputs.mode }}
          RESULTS_DIR: test-results
          SP_APP_NAME: ''
          PMS_ADMIN_TOKEN: ''
          ADS_ADMIN_TOKEN: ''
          CA_LOCATION: ''
          CERT_LOCATION: ''
          KEY_LOCATION: ''
          PMS_ENDPOINT: http://127.0.0.1:6733
          ADS_ENDPOINT: http://127.0.0.1:6734
        run: |
          set -euo pipefail
          GOPATH="$(go env GOPATH)"
          export GOPATH
          # The two runners share a physical host. Hold the lock across the
          # port preflight and every service lifetime, never kill foreign jobs.
          exec 9>/tmp/speedle-plus-test-services.lock
          flock -w 7200 9
          python3 - <<'PYTHON'
          import errno
          import socket
          for port in (2379, 2380, 27017, 6733, 6734):
              for family, address in ((socket.AF_INET, '0.0.0.0'), (socket.AF_INET, '127.0.0.1'), (socket.AF_INET6, '::'), (socket.AF_INET6, '::1')):
                  try:
                      with socket.socket(family, socket.SOCK_STREAM) as probe:
                          probe.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
                          if family == socket.AF_INET6:
                              probe.setsockopt(socket.IPPROTO_IPV6, socket.IPV6_V6ONLY, 1)
                          probe.bind((address, port))
                  except OSError as error:
                      if family == socket.AF_INET6 and error.errno in (errno.EAFNOSUPPORT, errno.EADDRNOTAVAIL):
                          continue
                      raise SystemExit(f'Test service port {port} is in use; refusing to touch an existing service.') from error
          print('Local etcd, MongoDB, PMS and ADS test ports are unused.')
          PYTHON
          case "${CI_TASK}" in
            test) scripts/ci/run-go-tests.sh gate ;;
            *) scripts/ci/run-go-tests.sh "${CI_TASK}" ;;
          esac

      - name: Setup Node for js/wasm tests
        if: inputs.mode == 'test'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Run js/wasm regression tests
        if: inputs.mode == 'test'
        run: |
          set -euo pipefail
          wasm_exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec"
          env -i PATH="${PATH}" HOME="${HOME}" TMPDIR="${TMPDIR:-/tmp}" \
            GOOS=js GOARCH=wasm \
            go test -count=1 -exec="${wasm_exec}" ./pkg/eval/wasmtest ./pkg/assertion/config
          bash scripts/ci/check-wasm-dependencies.sh

      - name: Clean owned MySQL containers
        if: always() && inputs.mode == 'nightly'
        run: |
          python3 scripts/ci/run-mysql-tests.py --cleanup

      - name: Upload coverage
        if: always() && inputs.mode == 'test'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

      - name: Upload scheduled test results
        if: always() && (inputs.mode == 'nightly' || inputs.mode == 'weekly' || inputs.mode == 'regression')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.mode }}-results
          path: test-results/
          if-no-files-found: warn

      - name: Build
        if: inputs.mode == 'build' || inputs.mode == 'quick'
        run: go build ./cmd/speedle-pms/... ./cmd/speedle-ads/... ./cmd/spctl/...

      # The default-branch worker keeps scheduling policy outside PR control.
      - name: Setup pinned Playground Go
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.3'
          cache: false

      - name: Setup Playground Node
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false

      # Playwright's browser revision follows the integrity-pinned lockfile.
      # Cache the binaries explicitly instead of relying on persistent host state.
      - name: Cache Playwright browsers
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ hashFiles('website/playground-engine/package-lock.json') }}

      - name: Install browser contrast dependencies
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        run: |
          set -euo pipefail
          npm --prefix website/playground-engine ci --ignore-scripts
          website/playground-engine/node_modules/.bin/playwright install chromium

      - name: Verify Playground release
        if: inputs.mode == 'build' && hashFiles('website/playground-engine/go.mod') != ''
        run: website/playground-engine/verify.sh
