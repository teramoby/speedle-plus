name: Restart Fiona trial on master
on:
  push:
    branches: [codex/dispatch-fiona-trial-20261030]
    paths: [.github/workflows/tmp-restart-fiona-trial.yml]
permissions:
  actions: write
jobs:
  restart:
    if: github.repository == 'teramoby/speedle-plus' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the obsolete candidate trial then dispatch master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          state="$(gh run view 40992739067 --repo teramoby/speedle-plus --json status --jq .status)"
          if [[ "$state" != completed ]]; then
            gh run cancel 40992739067 --repo teramoby/speedle-plus
          fi
          gh workflow run mongodb-nightly-validation.yml --repo teramoby/speedle-plus --ref master -f nightly_trial=true -f install_flock=true
          sleep 5
          gh run list --repo teramoby/speedle-plus --workflow mongodb-nightly-validation.yml --branch master --limit 2 --json databaseId,status,url
