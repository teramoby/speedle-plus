syntax = "proto3";

package pb;

option go_package = "github.com/teramoby/speedle-plus/pkg/svcs/adsgrpc/pb;pb";

import "pkg/svcs/adsgrpc/pb/messages.proto";

service Evaluator {
    rpc IsAllowed(speedle.ads.ContextRequest) returns(speedle.ads.IsAllowedResponse) {}
    rpc GetAllGrantedRoles(speedle.ads.ContextRequest) returns(speedle.ads.AllRoleResponse) {}
    rpc GetAllPermissions(speedle.ads.ContextRequest) returns(speedle.ads.AllPermissionResponse) {}

    rpc Discover(speedle.ads.ContextRequest) returns(speedle.ads.IsAllowedResponse) {}
    rpc Diagnose(speedle.ads.ContextRequest) returns(speedle.ads.EvaluationDebugResponse) {}
}
