syntax = "proto3";

package pb;

option go_package = "github.com/teramoby/speedle-plus/pkg/svcs/pmsgrpc/pb;pb";

import "pkg/svcs/pmsgrpc/pb/messages.proto";

service PolicyManager {
    rpc CreateFunction(speedle.pms.Function) returns(speedle.pms.Function) {}
    rpc QueryFunctions(speedle.pms.FunctionQueryRequest) returns(speedle.pms.FunctionQueryResponse) {}
    rpc DeleteFunctions(speedle.pms.FunctionQueryRequest) returns(speedle.pms.Empty) {}
    rpc CreateService(speedle.pms.ServiceRequest) returns(speedle.pms.Service) {}
    rpc QueryServices(speedle.pms.ServiceQueryRequest) returns(speedle.pms.ServiceQueryResponse) {}
    rpc DeleteServices(speedle.pms.ServiceQueryRequest) returns(speedle.pms.Empty) {}
    rpc CreatePolicy(speedle.pms.PolicyRequest) returns(speedle.pms.Policy) {}
    rpc QueryPolicies(speedle.pms.PolicyQueryRequest) returns(speedle.pms.PolicyQueryResponse) {}
    rpc DeletePolicies(speedle.pms.PolicyQueryRequest) returns(speedle.pms.Empty) {}
    rpc CreateRolePolicy(speedle.pms.RolePolicyRequest) returns(speedle.pms.RolePolicy) {}
    rpc QueryRolePolicies(speedle.pms.RolePolicyQueryRequest) returns(speedle.pms.RolePolicyQueryResponse) {}
    rpc DeleteRolePolicies(speedle.pms.RolePolicyQueryRequest) returns(speedle.pms.Empty) {}
    rpc ListPolicyCounts(speedle.pms.Empty) returns(speedle.pms.PolicyCountsMap) {}

    rpc GetDiscoverRequests(speedle.pms.DiscoverRequestsRequest) returns(speedle.pms.DiscoverRequestsResponse){}
    rpc ResetDiscoverRequests(speedle.pms.ResetRequestsRequest) returns(speedle.pms.ResetRequestsResponse){}
    rpc GetDiscoverPolicies(speedle.pms.DiscoverPoliciesRequest) returns(speedle.pms.DiscoverPoliciesResponse){}
}
